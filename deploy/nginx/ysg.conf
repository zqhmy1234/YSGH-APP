# ============================================================================
# 忆述光华 · 宿主 nginx 反代（拓扑 A · 容器化）· 2026-09-28
#
# 拓扑：
#   公网 :8010 ──► nginx ──► 127.0.0.1:8011 ──► backend 容器 :8010
#                  (本文件)   (API_UPSTREAM_PORT)  (容器内部端口)
#
# 为什么让 nginx 占 8010、而不让容器直接占：
#   · 客户端 `client/utils/config.uts` 的 getBaseUrl() **写死 8010**，这个端口不能换；
#   · 将来切 HTTPS、限制上传体积、透传真实 IP、按路径分流下载页，都需要一个反代的位置；
#   · 容器端口与对外端口解耦后，改内部实现（换容器/多副本）不必动客户端。
#
# ⚠️ 未在真机验证过（本机无 Linux 服务器）—— 上机时按 RUNBOOK §7 排障表逐项验。
#    验证要点：`nginx -t` 通过 → `curl -sS http://127.0.0.1:8010/healthz` 返回 {"status":"ok"}。
#
# 安装：
#   cp deploy/nginx/ysg.conf /etc/nginx/conf.d/ysg.conf
#   nginx -t && systemctl reload nginx
# ============================================================================

server {
    # 对外端口 = 客户端写死的 8010（安全组需放行 22 + 8010）
    listen 8010;
    # 内测期用 IP 直连；备案+域名到位后改成 server_name <你的域名>; 并切 HTTPS（见文件末）
    server_name _;

    # 上传体积上限。后端分片上传的**单片**上限远小于此值，这里限制的是"整次请求体"。
    # 语音/照片/长录音都要过这里 —— 设小了会在 nginx 层被拒（413），且**后端看不到日志**，
    # 是最容易被误判成"后端坏了"的一类故障。按需调大。
    client_max_body_size 100m;

    # 客户端与服务端之间的超时：ASR/LLM 链路偏慢（AGENT_SERVICE_TIMEOUT_S 默认 180s），
    # 若比它短会在 nginx 层先断（504），同样在后端看不到。
    proxy_connect_timeout 10s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    # 大文件上传时不要先整包缓冲到 nginx 临时目录（省内存与磁盘）
    proxy_request_buffering off;

    location / {
        proxy_pass http://127.0.0.1:8011;

        # 透传真实身份。⚠️ 后端 `RATE_LIMIT_TRUST_PROXY` 为 true 时才会信任
        # X-Forwarded-For —— 拓扑 A 下应把它设为 true，否则所有请求会被当成同一个来源 IP
        # （限流按 IP 计数时会误伤/失效）。见 deploy/.env.production.template 的 RATE_LIMIT_* 段。
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket / 长连接（当前后端未用；留作将来推送时的位置）
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 健康检查单独放行、不打日志（避免探活把 access.log 刷满）
    location = /healthz {
        proxy_pass http://127.0.0.1:8011/healthz;
        access_log off;
    }
}

# ============================================================================
# 切换 HTTPS 时（备案 + 域名 + 证书到位后，见 deploy/ONE_SWAP.md）：
#   1) 保留上面的 8010 明文 server 块不动（客户端契约不变），
#      或在客户端切到 443 后再关掉它；
#   2) 另起一个 443 server 块，证书用 certbot 签发；
#   3) 后端 `BASE_URL` 同步改成 https://<域名>（它决定媒体票据/回链的绝对地址）；
#   4) 客户端 `client/utils/config.uts` 的 PROD_BASE_URL 同步改，并跑
#      `powershell -File deploy/scripts/preflight_pack.ps1` 确认出包门全绿。
#
# 内测下载页（deploy/download/）如需对外提供，另开一个 server 块监听 80 或 8080，
# 并把 deploy/download/ 作为 root —— 注意安全组要额外放行该端口。
# ============================================================================
