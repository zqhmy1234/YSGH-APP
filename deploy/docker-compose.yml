# ============================================================================
# 忆述光华 · 单机部署 · 三个依赖服务（S1 卡 · 2026-09-21）
#
# 用法（在仓库根执行，`deploy/.env` 会被自动加载——compose 的 project 目录 = 本文件所在目录）：
#   docker compose -f deploy/docker-compose.yml up -d
#   docker compose -f deploy/docker-compose.yml ps
#   docker compose -f deploy/docker-compose.yml logs -f postgres
#
# ⚠️ 变量来源契约（与 S3 的 `deploy/.env.production.template` 共同维护，改一处须同步另一处）：
#   `deploy/.env` 同时承担两个职责：
#     ① 本文件插值（POSTGRES_USER/POSTGRES_PASSWORD/POSTGRES_DB/POSTGRES_PORT/QDRANT_* 等容器参数）
#     ② 宿主侧后端进程的环境（DATABASE_URL/REDIS_URL/QDRANT_URL 等，见 S3 模板与 systemd unit）
#   两份 URL 必须指向同一实例（宿主侧用 127.0.0.1:5432/6379/6333，容器内用服务名 postgres:5432）。
#
# ⚠️ 安全：三个服务的端口**一律绑 127.0.0.1**（不对公网暴露）。安全组只放行 22 与 8010。
#   Qdrant 未配 API Key（应用侧 config 只有 qdrant_url、无 api_key 字段）——仅在内网绑定时可接受；
#   若将来允许跨机访问，必须先加 QDRANT__SERVICE__API_KEY 并同步应用配置。
#
# ⚠️ 两种拓扑，按需选一种（服务名不冲突，可共存）：
#
#   【A · 容器化】← 本项目实际采用的部署方式（2026-09-28 用户拍板）
#     业务进程也跑容器：`--profile app` 起 backend + worker + agent 三个容器。
#     配套：宿主 nginx 监听 8010 → 反代到本机的 API_UPSTREAM_PORT（默认 8011）。
#     对宿主的要求最低：**宿主不需要 Python**（依赖与迁移都在镜像/容器里）。
#     ⚠️ 内存账必须重算：模型是**进程内单例、不跨进程共享**，两个业务进程各吃一份
#        BGE-M3(~1.2G)；16G 机器够不够以实测为准（docs/服务器规格核算_20260921.md §7）。
#
#   【B · 宿主 systemd】← 仓库原作者的方案（见 deploy/systemd/），仍然可用
#     业务进程跑宿主（yishu-api / yishu-worker），容器只承载下面三个依赖服务。
#     对宿主的要求更高：Python 3.11 + venv + 4-8G 依赖（见 deploy/RUNBOOK.md §1.1）。
#
#   两套拓扑**共用**下面 postgres/redis/qdrant 三个服务；backend/worker 只在 A 下启用。
# ============================================================================

name: yishu

# 日志轮转锚点：容器日志若不轮转会把 60G 系统盘涨满（本文件原本没有任何 logging 配置）。
# 用法：各服务写 `logging: *default-logging`。
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16 + pgvector
  # pgvector 扩展由镜像提供；扩展本身由 deploy/initdb/01-extensions.sql 在**首次初始化**时创建
  # （已核实 backend/migrations/ 中零 `vector` 引用 → alembic 不会建扩展；而
  #  backend/tests 有「扩展存在性」断言，故生产库必须有该扩展）。
  # ---------------------------------------------------------------------------
  postgres:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg16}
    container_name: yishu-postgres
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 未设置：请先在 deploy/.env 配置（bootstrap.sh 可自动生成）}
      POSTGRES_DB: ${POSTGRES_DB:-yishu}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    # 用**列表形式**（exec）而非折叠字符串：archive_command 含空格与 `&&`，
    # 字符串形式会被 /bin/sh -c 解析成两条命令（`&&` 被当 shell 运算符），必须避开 shell 解析。
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=8MB
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-50}
      # WAL 归档（PITR，RPO ≤5min）：**默认 off**。开启见 deploy/RUNBOOK.md §6（含目录属主步骤与验证 SQL）。
      # 默认关是刻意的：archive_command 失败会让 PG 持续保留 WAL 直至 pg_wal 打满磁盘。
      - -c
      - archive_mode=${PG_ARCHIVE_MODE:-off}
      - -c
      - "archive_command=${PG_ARCHIVE_COMMAND:-test ! -f /var/lib/postgresql/wal-archive/%f && cp %p /var/lib/postgresql/wal-archive/%f}"
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./data/wal-archive:/var/lib/postgresql/wal-archive
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-yishu}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    # 上限=护栏（非占用量）：核算书 §2 给 PG 的估算为 0.4–0.6G，实测见核算书 §7 校验表
    mem_limit: ${POSTGRES_MEM_LIMIT:-768m}
    # WAL 归档（PITR，RPO ≤5min）：S3 卡已接线，**默认 off**（PG_ARCHIVE_MODE 未设 → archive_mode=off）。
    # 开启前提：归档目录属主 = postgres(uid 999)（bootstrap.sh 在开关为 on 时会自动修正），
    # 否则 archive_command 反复失败 → pg_wal 持续增长打满磁盘。步骤与验证见 deploy/RUNBOOK.md §6。

  # ---------------------------------------------------------------------------
  # Redis 7（AOF 持久化）
  # `maxmemory-policy noeviction` 是**硬要求**：RQ 的队列数据被逐出会导致任务静默丢失。
  # ---------------------------------------------------------------------------
  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    container_name: yishu-redis
    restart: unless-stopped
    logging: *default-logging
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory ${REDIS_MAXMEMORY:-320mb}
      --maxmemory-policy noeviction
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    mem_limit: ${REDIS_MEM_LIMIT:-384m}

  # ---------------------------------------------------------------------------
  # Qdrant（named vectors：BGE-M3 dense + sparse）
  # 镜像 tag **已钉死为 v1.19.0**（2026-09-28 改）——理由：CI 钉的是同一版本
  # （.github/workflows/ci.yml），且 backend/requirements.txt 要求 qdrant-client>=1.19；
  # 旧 server 与新 client 不兼容会导致 payload 刷新 404（docs/lessons.md 有事故记录）。
  # 原写法兜底 `latest` 会让"上机时装到什么版本"不可复现。要变更请显式改 QDRANT_IMAGE。
  # healthcheck 用官方 compose 示例的 bash /dev/tcp 探活（镜像自带 bash）。
  # ---------------------------------------------------------------------------
  qdrant:
    image: ${QDRANT_IMAGE:-qdrant/qdrant:v1.19.0}
    container_name: yishu-qdrant
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:${QDRANT_HTTP_PORT:-6333}:6333"
      - "127.0.0.1:${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - ./data/qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", ":> /dev/tcp/localhost/6333"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: ${QDRANT_MEM_LIMIT:-768m}

  # ---------------------------------------------------------------------------
  # 业务进程容器（profile=app）—— 拓扑 A 使用；拓扑 B（宿主 systemd）下不启用
  #
  # 🔴 2026-09-28 修正：原写法用 POSTGRES_HOST/REDIS_HOST/QDRANT_HOST 覆写连接，
  #   但**应用根本不读这三个变量**（backend/app 零引用；config.py 只有
  #   database_url / redis_url / qdrant_url 三个整串字段）⇒ 容器会拿 .env 里的
  #   宿主形态 URL（127.0.0.1）去连，而 127.0.0.1 在容器内是它自己 ⇒ 连不上。
  #   而且**症状是静默的**：容器正常起、/healthz 也返回 200（引擎惰性连接、healthz 不碰库），
  #   直到第一个碰库的请求才失败。现改为**显式覆写三个 URL**（值用服务名）。
  # ---------------------------------------------------------------------------
  backend:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    image: yishu-backend:local
    container_name: yishu-backend
    restart: unless-stopped
    logging: *default-logging
    env_file: &app-envfile
      - .env
    environment: &app-env
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-yishu}
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      # 2026-09-28（agent 接线）：反代目标必须写成**服务名**。
      #   `.env` 里是 http://127.0.0.1:8300（宿主视角，拓扑 B 用），但容器内 127.0.0.1
      #   是它自己 ⇒ 照抄就又是一次「静默连不上」（与上面三个 URL 同一类坑）。
      AGENT_SERVICE_BASE_URL: http://agent:8300
    volumes: &app-volumes
      # 模型资产以只读挂载进入（不烘进镜像，避免镜像膨胀到数 GB）
      - ../backend/models:/app/models:ro
      - ./data/hf-cache:/root/.cache/huggingface
    depends_on: &app-depends
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    # 宿主 nginx 监听 8010 → 反代到 API_UPSTREAM_PORT（默认 8011）。
    # 不让容器直接占 8010 是给 nginx 留位置：将来切 HTTPS / 限制上传体积 / 透传真实 IP 都要它。
    ports:
      - "127.0.0.1:${API_UPSTREAM_PORT:-8011}:8010"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8010", "--workers", "1"]
    mem_limit: ${BACKEND_MEM_LIMIT:-6g}

  # ---------------------------------------------------------------------------
  # RQ worker（2026-09-28 新增）—— 拓扑 A 下的**必需**组件，原文件整个漏了
  #   没有它：管线只入队不消费 ⇒ 内容永远 processing、向量库永远为空、检索永远无结果，
  #   而且**不报错**（这是最容易误判成"代码坏了"的一类静默失效）。
  #   必须用 `python -m app.workers.worker`（worker.py 里 with_scheduler=True 是
  #   RQ Retry 真正生效的前提），不要用裸 `rq worker`。
  #   worker 也要吃模型（分类/嵌入），故与 backend 挂**同一份**模型与 HF 缓存。
  #   ⚠️ 两个业务进程 = 两份 BGE-M3（进程内单例不可共享），内存上限务必上机实测。
  # ---------------------------------------------------------------------------
  worker:
    profiles: ["app"]
    image: yishu-backend:local
    container_name: yishu-worker
    restart: unless-stopped
    logging: *default-logging
    env_file: *app-envfile
    environment: *app-env
    volumes: *app-volumes
    depends_on: *app-depends
    command: ["python", "-m", "app.workers.worker", "high", "low"]
    mem_limit: ${WORKER_MEM_LIMIT:-4g}

  # ---------------------------------------------------------------------------
  # Agent 服务（AG5 接线；2026-09-28 新增）—— 拓扑 A 下的必需组件（内测要「AI 对话页」）
  #   后端 `POST /api/v1/chat/messages` 反代调它（唯一出口：
  #   backend/app/services/external/agent.py → POST /v1/chat + GET /health）。
  #   缺它的后果：对话接口返回 502/504（后端刻意**不伪造回复**），客户端 AI 对话页拿不到回复。
  #
  #   ⚠️ 四条必须理解的差异，否则必然踩（前三条都是"静默"型）：
  #   1. **不 publish 端口**：agent 自身**不鉴权用户身份**，只校验一个共享 token
  #      （agent/src/main.py:106-109 比对 X-Agent-Token），且它另有 /api/* 管理面
  #      **完全不校验 token**（agent/src/web/api_routes.py）⇒ 绝不可对外暴露。
  #      对外入口只有 宿主 nginx → backend，客户端只认后端的 JWT。
  #   2. **DATABASE_URL 必须是「不带 +psycopg」的形态**：agent 的
  #      src/storage/memory/memory_saver.py:37 把这个串**直接交给 `psycopg.connect()`**，
  #      而 psycopg3 只认 `postgresql://` / `postgres://` 前缀。给 `postgresql+psycopg://`
  #      （backend 的写法）会让 langgraph checkpointer 被 except 吞掉并**静默降级成
  #      内存态 MemorySaver**（只有一行 warning "data will not persist across restarts"）
  #      ⇒ 多轮上下文不跨重启持久化，而接口一切正常。故此处刻意与 backend 写法不同。
  #   3. **百炼 key 必须与后端是不同账号**：两边变量名都叫 DASHSCOPE_API_KEY，
  #      若直接复用，agent 会拿后端账号的 key 去调（**不会报错** —— 两边都是有效 key），
  #      只是走错账号的配额/端点。故 .env 里用 AGENT_DASHSCOPE_API_KEY 单独存放，
  #      在这里改名注入。（上游 .env.example:11-15 明确要求 Token Plan 账号。）
  #   4. 不需要 Redis / Qdrant（agent/src 对 REDIS_/QDRANT_ 零命中），也不需要模型卷
  #      （模型走远端百炼 API）—— 与 backend/worker 的挂载刻意不同。
  # ---------------------------------------------------------------------------
  agent:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.agent
    image: yishu-agent:local
    container_name: yishu-agent
    restart: unless-stopped
    logging: *default-logging
    env_file: *app-envfile
    environment:
      # 见上面第 2 条：**不带 +psycopg**
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-yishu}
      # 与 backend 侧**同名同值**（backend 读 AGENT_SERVICE_TOKEN 并发 X-Agent-Token 头）。
      # 缺失即拒绝启动（fail-closed）：这个 token 由 bootstrap.sh 自动生成，不需要人工去要。
      AGENT_SERVICE_TOKEN: ${AGENT_SERVICE_TOKEN:?AGENT_SERVICE_TOKEN 未设置：backend 与 agent 必须共享同一值（bootstrap.sh 会自动生成）}
      # 见上面第 3 条：改名注入 **另一个账号** 的 key
      DASHSCOPE_API_KEY: ${AGENT_DASHSCOPE_API_KEY:?AGENT_DASHSCOPE_API_KEY 未设置：agent 必须用与后端不同的百炼账号 key（见 deploy/.env.production.template §7）}
      DASHSCOPE_WORKSPACE_ID: ${AGENT_DASHSCOPE_WORKSPACE_ID:-}
      DASHSCOPE_REGION: ${AGENT_DASHSCOPE_REGION:-cn-beijing}
    depends_on:
      postgres:
        condition: service_healthy
    # agent 是薄 API 层（无本地模型、无 torch），内存需求远低于 backend/worker
    mem_limit: ${AGENT_MEM_LIMIT:-768m}
