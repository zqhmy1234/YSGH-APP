<svg xmlns="http://www.w3.org/2000/svg" width="1620" height="1000" viewBox="0 0 1620 1000">
<defs><marker id="ah-ink" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#16324F"/></marker><marker id="ah-teal" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2F6F7E"/></marker><marker id="ah-warm" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#C7763F"/></marker><marker id="ah-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#A9B7C5"/></marker><marker id="ah-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#A8452F"/></marker></defs>
<rect width="1620" height="1000" fill="#FFFFFF"/>
<text x="40" y="46" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="26" font-weight="600" fill="#16324F" text-anchor="start" letter-spacing="0">B8 家庭域｜权限模型：默认看不见，共享才看得见</text>
<text x="40" y="72" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="13" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">角色 × 范围 双维授权；老人端是同一 App 的受限形态，不是另一套系统</text>
<rect x="1507.36" y="26" width="72.64" height="30" rx="15" fill="#EAF2F4" stroke="#2F6F7E" stroke-width="1" opacity="1"/>
<text x="1543.68" y="46" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#2F6F7E" text-anchor="middle" letter-spacing="0">图 18</text>
<text x="40" y="108" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#16324F" text-anchor="start" letter-spacing="0">① 角色 × 范围（默认拒绝，显式授予）</text>
<rect x="40" y="124" width="175" height="60" rx="10" fill="#F3F6FA" stroke="#DDE4EB" stroke-width="1" opacity="1"/>
<text x="52" y="150" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.4" font-weight="600" fill="#16324F" text-anchor="start" letter-spacing="0"></text>
<rect x="215" y="124" width="175" height="60" rx="10" fill="#F3F6FA" stroke="#DDE4EB" stroke-width="1" opacity="1"/>
<text x="227" y="150" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.4" font-weight="600" fill="#16324F" text-anchor="start" letter-spacing="0">all（全库）</text>
<rect x="390" y="124" width="175" height="60" rx="10" fill="#F3F6FA" stroke="#DDE4EB" stroke-width="1" opacity="1"/>
<text x="402" y="150" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.4" font-weight="600" fill="#16324F" text-anchor="start" letter-spacing="0">album（相册）</text>
<rect x="565" y="124" width="175" height="60" rx="10" fill="#F3F6FA" stroke="#DDE4EB" stroke-width="1" opacity="1"/>
<text x="577" y="150" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.4" font-weight="600" fill="#16324F" text-anchor="start" letter-spacing="0">event（单个事件）</text>
<rect x="40" y="184" width="175" height="60" rx="10" fill="#F3F6FA" stroke="#DDE4EB" stroke-width="1" opacity="1"/>
<text x="52" y="210" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.4" font-weight="600" fill="#16324F" text-anchor="start" letter-spacing="0">owner（本人）</text>
<rect x="215" y="184" width="175" height="60" rx="10" fill="#FFFFFF" stroke="#DDE4EB" stroke-width="1" opacity="1"/>
<text x="227" y="210" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.4" font-weight="normal" fill="#2F6F7E" text-anchor="start" letter-spacing="0">✓ 全部</text>
<rect x="390" y="184" width="175" height="60" rx="10" fill="#FFFFFF" stroke="#DDE4EB" stroke-width="1" opacity="1"/>
<text x="402" y="210" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.4" font-weight="normal" fill="#2F6F7E" text-anchor="start" letter-spacing="0">✓</text>
<rect x="565" y="184" width="175" height="60" rx="10" fill="#FFFFFF" stroke="#DDE4EB" stroke-width="1" opacity="1"/>
<text x="577" y="210" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.4" font-weight="normal" fill="#2F6F7E" text-anchor="start" letter-spacing="0">✓</text>
<rect x="40" y="244" width="175" height="60" rx="10" fill="#F3F6FA" stroke="#DDE4EB" stroke-width="1" opacity="1"/>
<text x="52" y="270" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.4" font-weight="600" fill="#16324F" text-anchor="start" letter-spacing="0">editor（家人协作）</text>
<rect x="215" y="244" width="175" height="60" rx="10" fill="#FDF6F4" stroke="#DDE4EB" stroke-width="1" opacity="1"/>
<text x="227" y="270" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.4" font-weight="normal" fill="#A8452F" text-anchor="start" letter-spacing="0">× 默认不给</text>
<rect x="390" y="244" width="175" height="60" rx="10" fill="#FFFFFF" stroke="#DDE4EB" stroke-width="1" opacity="1"/>
<text x="402" y="270" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.4" font-weight="normal" fill="#2F6F7E" text-anchor="start" letter-spacing="0">✓ 指定相册可增删</text>
<rect x="565" y="244" width="175" height="60" rx="10" fill="#FFFFFF" stroke="#DDE4EB" stroke-width="1" opacity="1"/>
<text x="577" y="270" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.4" font-weight="normal" fill="#2F6F7E" text-anchor="start" letter-spacing="0">✓ 指定事件可编辑</text>
<rect x="40" y="304" width="175" height="60" rx="10" fill="#F3F6FA" stroke="#DDE4EB" stroke-width="1" opacity="1"/>
<text x="52" y="330" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.4" font-weight="600" fill="#16324F" text-anchor="start" letter-spacing="0">viewer（只看）</text>
<rect x="215" y="304" width="175" height="60" rx="10" fill="#FDF6F4" stroke="#DDE4EB" stroke-width="1" opacity="1"/>
<text x="227" y="330" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.4" font-weight="normal" fill="#A8452F" text-anchor="start" letter-spacing="0">× 永不开放</text>
<rect x="390" y="304" width="175" height="60" rx="10" fill="#FFFFFF" stroke="#DDE4EB" stroke-width="1" opacity="1"/>
<text x="402" y="330" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.4" font-weight="normal" fill="#2F6F7E" text-anchor="start" letter-spacing="0">✓ 只看被分享的</text>
<rect x="565" y="304" width="175" height="60" rx="10" fill="#FFFFFF" stroke="#DDE4EB" stroke-width="1" opacity="1"/>
<text x="577" y="330" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.4" font-weight="normal" fill="#2F6F7E" text-anchor="start" letter-spacing="0">✓ 只看被分享的</text>
<text x="40" y="388" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.4" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">读法：行是「这个人是谁」，列是「授权到哪一层」。空着的组合 = 没有权限，不是待配置。</text>
<rect x="760" y="112" width="820" height="260" rx="10" fill="#FFFFFF" stroke="#A9B7C5" stroke-width="1" opacity="1"/>
<text x="776" y="138" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#16324F" text-anchor="start" letter-spacing="0">② 三张表就够（不加第四张）</text>
<text x="776" y="156" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">family_group   (id, owner_id, name, created_at)</text>
<text x="776" y="184" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">family_member  (group_id, user_id, role, scope, granted_at)</text>
<text x="776" y="212" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">handoff_log     (from_user, to_user, object_type, object_id, at, note)</text>
<text x="776" y="240" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">scope 是「对象级」不是「库级」：album / event 各一条授权记录；撤销 = 删一条 member 行。</text>
<text x="776" y="268" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">禁区：没有「家庭成员自动可见全部」的开关——根本没有这个字段。</text>
<text x="776" y="296" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">禁区：没有 owner 之外的「管理员」，避免一个账号被家人拿去全权操作。</text>
<text x="776" y="344" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="600" fill="#2F6F7E" text-anchor="start" letter-spacing="0">为什么不做「权限组」：三张表能表达的，加一层 RBAC 只会多出解释成本。</text>
<rect x="40" y="418" width="760" height="280" rx="10" fill="#F8EEE7" stroke="#C7763F" stroke-width="1" opacity="1"/>
<text x="56" y="444" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#C7763F" text-anchor="start" letter-spacing="0">③ 老人端 = 同一 App 的受限形态（需求 42）</text>
<text x="56" y="462" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.4" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">字号：var() token 重写（1.3× / 1.5×），不是另做一套 UI</text>
<text x="56" y="488" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.4" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">交互：大按钮、单列、语音优先、关键动作二次确认</text>
<text x="56" y="514" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.4" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">隐藏：多选批量、复杂筛选、专业术语、任何涉钱入口</text>
<text x="56" y="556" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">同一份前端代码，两种形态——避免「老人版」变成第二个没人维护的仓库。</text>
<text x="56" y="586" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="600" fill="#3C5A78" text-anchor="start" letter-spacing="0">验收口径：主流程（导入 / 找一张照片 / 听一段语音）在 1.5× 字号下不出横向滚动条。</text>
<text x="56" y="616" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#A8452F" text-anchor="start" letter-spacing="0">禁：把「适老」做成一个独立 App（两套埋点、两套权限、两套 bug）。</text>
<text x="56" y="646" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#A8452F" text-anchor="start" letter-spacing="0">禁：在老人端出现任何支付/订阅入口——不是隐藏，是代码里没有这个组件。</text>
<rect x="820" y="418" width="760" height="280" rx="10" fill="#EAF2F4" stroke="#2F6F7E" stroke-width="1" opacity="1"/>
<text x="836" y="444" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#2F6F7E" text-anchor="start" letter-spacing="0">④ 问答引导（需求 43）：把「空时间轴」变成「有素材」</text>
<text x="836" y="462" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.4" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">interview_session 按人生阶段（儿时 / 求学 / 工作 / 家庭）出题</text>
<text x="836" y="488" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.4" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">→ 用户口述（或打字） → ASR → 写入 contents（不是只写画像）</text>
<text x="836" y="514" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.4" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">→ 进事件聚合（L2/L3） → 时间轴立刻有东西可翻</text>
<text x="836" y="540" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.4" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">→ 老人端首页出现「您的故事」条目，而不是空白页</text>
<text x="836" y="580" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.4" font-weight="600" fill="#A8452F" text-anchor="start" letter-spacing="0">为什么必须写 contents：只写画像 = 时间轴还是空的，用户看不到自己说的话。</text>
<text x="836" y="610" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.4" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">为什么必须进聚合：单独一条语音没有「事件」，翻不出来也就分享不出去。</text>
<text x="836" y="646" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.4" font-weight="normal" fill="#3C5A78" text-anchor="start" letter-spacing="0">配套：每段口述给一条「已收进回忆」回执（需求 30 同口径），不给假进度条。</text>
<rect x="40" y="716" width="1540" height="196" rx="10" fill="#FDF6F4" stroke="#A8452F" stroke-width="1" opacity="1"/>
<text x="56" y="742" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#A8452F" text-anchor="start" letter-spacing="0">⑤ 四条红线（每条都能被门禁断言）</text>
<text x="56" y="764" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.6" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">1. 可见性最小化：viewer 默认只能看被显式共享的相册/事件，不能全库漫游（G8：无 scope 返回空，不返回全部）。</text>
<text x="56" y="794" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.6" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">2. 交接留痕：妈妈把「宝宝成长册」交给爸爸 → handoff_log 一条；谁在什么时候拿到什么，可追溯。</text>
<text x="56" y="824" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.6" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">3. 术语单一来源（需求 45）：禁「整理 / 清理 / 删除」，用「精选 / 回忆 / 故事」；G10 第 5 轴断言。</text>
<text x="56" y="854" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.6" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">4. 删除权归属：只有 owner 能删组；被共享者只能撤自己的授权，不能删别人的素材（四层 purge 只对本人资产生效）。</text>
<text x="40" y="952" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#3C5A78" text-anchor="start" letter-spacing="0">一句话：家庭域的难点不是「怎么共享」，是「怎么保证不该看见的永远看不见」——所以默认值是 ×，不是 ✓。</text>
</svg>
