<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="900" viewBox="0 0 1560 900">
<defs><marker id="ah-ink" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#16324F"/></marker><marker id="ah-teal" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2F6F7E"/></marker><marker id="ah-warm" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#C7763F"/></marker><marker id="ah-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#A9B7C5"/></marker><marker id="ah-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#A8452F"/></marker></defs>
<rect width="1560" height="900" fill="#FFFFFF"/>
<text x="40" y="46" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="26" font-weight="600" fill="#16324F" text-anchor="start" letter-spacing="0">B2 事件聚合｜四层阶梯：从 1 张照片到 1 条故事线</text>
<text x="40" y="72" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="13" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">自动只提案，用户拆/并永远优先；事件是检索单元，不是照片是单元</text>
<rect x="1447.36" y="26" width="72.64" height="30" rx="15" fill="#EAF2F4" stroke="#2F6F7E" stroke-width="1" opacity="1"/>
<text x="1483.68" y="46" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#2F6F7E" text-anchor="middle" letter-spacing="0">图 13</text>
<rect x="40" y="116" width="900" height="148" rx="10" fill="#FFFFFF" stroke="#A9B7C5" stroke-width="1" opacity="1"/>
<rect x="40" y="116" width="6" height="148" rx="2" fill="#3C5A78" stroke="#3C5A78" stroke-width="0" opacity="1"/>
<text x="64" y="156" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#16324F" text-anchor="start" letter-spacing="0">L1 内容</text>
<text x="160" y="156" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#3C5A78" text-anchor="start" letter-spacing="0">素材</text>
<text x="64" y="192" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.8" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">单张照片 / 单条语音 / 单条文字（contents 一行）</text>
<text x="64" y="220" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" fill="#3C5A78" text-anchor="start" letter-spacing="0">聚合方式：自动，无聚合</text>
<text x="64" y="244" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="600" fill="#647788" text-anchor="start" letter-spacing="0">服务于 需求 1 2 3 5</text>
<line x1="490" y1="264" x2="490" y2="286" stroke="#3C5A78" stroke-width="1.6" marker-end="url(#ah-ink)"/>
<rect x="40" y="286" width="900" height="148" rx="10" fill="#FFFFFF" stroke="#A9B7C5" stroke-width="1" opacity="1"/>
<rect x="40" y="286" width="6" height="148" rx="2" fill="#2F6F7E" stroke="#2F6F7E" stroke-width="0" opacity="1"/>
<text x="64" y="326" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#16324F" text-anchor="start" letter-spacing="0">L2 会话</text>
<text x="160" y="326" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#2F6F7E" text-anchor="start" letter-spacing="0">半自动</text>
<text x="64" y="362" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.8" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">同一地点 + 短时间窗的连续素材（ST-DBSCAN 空间-时间聚类）</text>
<text x="64" y="390" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" fill="#3C5A78" text-anchor="start" letter-spacing="0">聚合方式：算法自动分组，不命名</text>
<text x="64" y="414" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="600" fill="#647788" text-anchor="start" letter-spacing="0">服务于 需求 13 18</text>
<line x1="490" y1="434" x2="490" y2="456" stroke="#2F6F7E" stroke-width="1.6" marker-end="url(#ah-teal)"/>
<rect x="40" y="456" width="900" height="148" rx="10" fill="#FFFFFF" stroke="#A9B7C5" stroke-width="1" opacity="1"/>
<rect x="40" y="456" width="6" height="148" rx="2" fill="#C7763F" stroke="#C7763F" stroke-width="0" opacity="1"/>
<text x="64" y="496" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#16324F" text-anchor="start" letter-spacing="0">L3 事件</text>
<text x="160" y="496" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#C7763F" text-anchor="start" letter-spacing="0">一件事</text>
<text x="64" y="532" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.8" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">可命名的一件事：「那次吃火锅」——自动提案 + 用户确认/命名</text>
<text x="64" y="560" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" fill="#3C5A78" text-anchor="start" letter-spacing="0">聚合方式：自动提案，用户确认</text>
<text x="64" y="584" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="600" fill="#647788" text-anchor="start" letter-spacing="0">服务于 需求 8 13 14 18</text>
<line x1="490" y1="604" x2="490" y2="626" stroke="#C7763F" stroke-width="1.6" marker-end="url(#ah-warm)"/>
<rect x="40" y="626" width="900" height="148" rx="10" fill="#FFFFFF" stroke="#A9B7C5" stroke-width="1" opacity="1"/>
<rect x="40" y="626" width="6" height="148" rx="2" fill="#A8452F" stroke="#A8452F" stroke-width="0" opacity="1"/>
<text x="64" y="666" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#16324F" text-anchor="start" letter-spacing="0">L4 故事线</text>
<text x="160" y="666" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#A8452F" text-anchor="start" letter-spacing="0">一段时期</text>
<text x="64" y="702" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.8" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">事件序列：「小宝 0-3 岁」「刚工作那两年」——按人生阶段/时间轴</text>
<text x="64" y="730" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" fill="#3C5A78" text-anchor="start" letter-spacing="0">聚合方式：用户或时间驱动，Sculptor 提案</text>
<text x="64" y="754" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="600" fill="#647788" text-anchor="start" letter-spacing="0">服务于 需求 18 23 44</text>
<rect x="970" y="116" width="550" height="330" rx="10" fill="#FFFFFF" stroke="#A9B7C5" stroke-width="1" opacity="1"/>
<text x="986" y="142" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#16324F" text-anchor="start" letter-spacing="0">三条治理规则（缺一条就会退化成「自动乱merge」）</text>
<text x="986" y="162" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11.2" font-weight="600" fill="#2F6F7E" text-anchor="start" letter-spacing="0">① 用户拆/并永远优先</text>
<text x="986" y="182" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">自动聚合只提案；用户点「这不是一件事」→ 永久拆开。</text>
<text x="986" y="200" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">算法此后不再覆盖这个决定（与需求 33 同一条铁律）。</text>
<text x="986" y="230" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11.2" font-weight="600" fill="#2F6F7E" text-anchor="start" letter-spacing="0">② 幂等键同源</text>
<text x="986" y="250" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">照片 / 语音 / 文字进事件卡必须共用同一个 event_key 生成器。</text>
<text x="986" y="268" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">否则「文字语音进不了照片卡」的断链会反复出现。</text>
<text x="986" y="298" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11.2" font-weight="600" fill="#2F6F7E" text-anchor="start" letter-spacing="0">③ 事件即检索单元</text>
<text x="986" y="318" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">返回 EventCard（一张卡），不是 30 张照片。</text>
<text x="986" y="336" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">这是需求 13 的落点，也是控制结果噪声的关键。</text>
<rect x="970" y="470" width="550" height="322" rx="10" fill="#F8EEE7" stroke="#C7763F" stroke-width="1" opacity="1"/>
<text x="986" y="496" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#C7763F" text-anchor="start" letter-spacing="0">一次「拆开」的全过程（不可被算法回滚）</text>
<text x="986" y="512" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.4" font-weight="normal" fill="#3C5A78" text-anchor="start" letter-spacing="0">① 算法提案：13 张照片 + 2 条语音 → 1 个事件「周末爬山」</text>
<text x="986" y="542" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.4" font-weight="normal" fill="#3C5A78" text-anchor="start" letter-spacing="0">② 用户点「这不是一件事」→ 写入 user_override=split</text>
<text x="986" y="572" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.4" font-weight="normal" fill="#3C5A78" text-anchor="start" letter-spacing="0">③ 事件卡拆分：保留子卡，父卡标记 dissoloved，不删素材</text>
<text x="986" y="602" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.4" font-weight="normal" fill="#3C5A78" text-anchor="start" letter-spacing="0">④ 下一次聚合只读 user_override，先判「已拆」再聚类</text>
<text x="986" y="632" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.4" font-weight="normal" fill="#3C5A78" text-anchor="start" letter-spacing="0">⑤ 结果：同一批素材不会再被合回去；时间轴显示两张卡</text>
<text x="986" y="668" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.6" font-weight="600" fill="#A8452F" text-anchor="start" letter-spacing="0">红线：自动算法永不覆盖用户决定——这条写进门禁 G6。</text>
<rect x="40" y="812" width="1480" height="62" rx="10" fill="#F3F6FA" stroke="#DDE4EB" stroke-width="1" opacity="1"/>
<text x="60" y="838" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#16324F" text-anchor="start" letter-spacing="0">为什么四层而不是一层：L1 是「有没有」，L2 是「在哪里/什么时候」，L3 是「这是什么」，L4 是「这属于哪段人生」。</text>
<text x="60" y="860" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">四层各自可独立重跑：L1 失败不影响 L3 已有卡；L3 命名错了只改卡，不动素材（原始永不被改写）。</text>
</svg>
