<svg xmlns="http://www.w3.org/2000/svg" width="1620" height="1620" viewBox="0 0 1620 1620">
<defs><marker id="ah-ink" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#16324F"/></marker><marker id="ah-teal" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2F6F7E"/></marker><marker id="ah-warm" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#C7763F"/></marker><marker id="ah-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#A9B7C5"/></marker><marker id="ah-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#A8452F"/></marker></defs>
<rect width="1620" height="1620" fill="#FFFFFF"/>
<g transform="translate(0.0,340.0)">
<text x="40" y="46" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="26" font-weight="600" fill="#16324F" text-anchor="start" letter-spacing="0">B7 有人味｜共情、性格、情绪描述、危机接管（四件互不替代的事）</text>
<text x="40" y="72" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="13" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">共情是行为约束，性格是参数，情绪描述是 schema，危机是硬停——不能混成一个 prompt</text>
<rect x="1507.36" y="26" width="72.64" height="30" rx="15" fill="#EAF2F4" stroke="#2F6F7E" stroke-width="1" opacity="1"/>
<text x="1543.68" y="46" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#2F6F7E" text-anchor="middle" letter-spacing="0">图 17</text>
<rect x="40" y="112" width="500" height="360" rx="10" fill="#EAF2F4" stroke="#2F6F7E" stroke-width="1" opacity="1"/>
<text x="56" y="138" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#2F6F7E" text-anchor="start" letter-spacing="0">① 共情优先（需求 35）</text>
<text x="56" y="164" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.4" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">三轴：命名情绪 → 承认处境 → 不评判</text>
<text x="56" y="188" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.4" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">禁语清单内联进提示（「别想太多」「至少你还有…」）</text>
<text x="56" y="212" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.4" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">判定 empathy_violations()：纯函数，可单测</text>
<text x="56" y="236" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.4" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">fail-open：判不出来也不阻断回复（宁可温和，不可审问）</text>
<rect x="56" y="306" width="468" height="150" rx="10" fill="#FFFFFF" stroke="#A9B7C5" stroke-width="1" opacity="1"/>
<text x="72" y="334" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.6" font-weight="600" fill="#16324F" text-anchor="start" letter-spacing="0">禁语样例（可增不可减）</text>
<text x="72" y="358" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">「你要往好处想」  「至少…」  「我理解你」（空转）</text>
<text x="72" y="380" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">「别难过了」  「这没什么」  「你应该…」</text>
<text x="72" y="434" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">判定命中 → 不重写整句，只换这一处（保人设）。</text>
<rect x="570" y="112" width="480" height="360" rx="10" fill="#F8EEE7" stroke="#C7763F" stroke-width="1" opacity="1"/>
<text x="586" y="138" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#C7763F" text-anchor="start" letter-spacing="0">② AI 性格（需求 36）</text>
<text x="586" y="164" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.4" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">5 个封闭维度（不给自由文本，避免人设漂移）：</text>
<text x="586" y="188" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.4" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">warmth / verbosity / advice / tone / emotion_display</text>
<text x="586" y="232" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#2F6F7E" text-anchor="start" letter-spacing="0">warmth</text>
<text x="706" y="232" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">亲疏：克制 ↔ 热络</text>
<text x="586" y="262" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#2F6F7E" text-anchor="start" letter-spacing="0">verbosity</text>
<text x="706" y="262" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">话多：一句 ↔ 一段</text>
<text x="586" y="292" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#2F6F7E" text-anchor="start" letter-spacing="0">advice</text>
<text x="706" y="292" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">建议：只陪 ↔ 会给法子</text>
<text x="586" y="322" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#2F6F7E" text-anchor="start" letter-spacing="0">tone</text>
<text x="706" y="322" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">语气：平实 ↔ 俏皮</text>
<text x="586" y="352" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#2F6F7E" text-anchor="start" letter-spacing="0">emotion_display</text>
<text x="706" y="352" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">情绪外显：内敛 ↔ 明显</text>
<text x="586" y="388" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.4" font-weight="600" fill="#16324F" text-anchor="start" letter-spacing="0">拼装方式：middleware 每轮拼 → 不改进程单例 prompt</text>
<text x="586" y="412" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">（改单例 = 一个用户改性格会影响其他人，这是老 bug 的根因）</text>
<text x="586" y="440" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">PersonaPort 契约：读一次、按会话生效、可回滚。</text>
<rect x="1070" y="112" width="510" height="360" rx="10" fill="#FFFFFF" stroke="#A9B7C5" stroke-width="1" opacity="1"/>
<text x="1086" y="138" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#3C5A78" text-anchor="start" letter-spacing="0">③ 情绪描述与解释权（需求 39-40）</text>
<text x="1086" y="164" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.8" font-weight="600" fill="#16324F" text-anchor="start" letter-spacing="0">输出 schema：{valence, arousal, cues[], basis}</text>
<text x="1086" y="190" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.4" font-weight="600" fill="#A8452F" text-anchor="start" letter-spacing="0">契约里没有 confidence 字段 —— 客户端 UTS 编译期就删这个字段。</text>
<text x="1086" y="220" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.3" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">为什么不给置信度：情绪判断本来就没有真值，给数字=假装客观，</text>
<text x="1086" y="242" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.3" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">用户会拿它当结论（「你说我 87% 难过」）。</text>
<rect x="1086" y="266" width="478" height="186" rx="10" fill="#F3F6FA" stroke="#A9B7C5" stroke-width="1" opacity="1"/>
<text x="1102" y="292" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.6" font-weight="600" fill="#16324F" text-anchor="start" letter-spacing="0">解释权归用户（需求 40）</text>
<text x="1102" y="316" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.3" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">可关：emotion_display=off → 不再描述情绪</text>
<text x="1102" y="338" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.3" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">可改：用户说「我不是难过，是累」→ correction.field=emotion</text>
<text x="1102" y="360" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.3" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">可纠正：写入 correction_log，下次同类 cues 直接采信用户</text>
<text x="1102" y="382" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.3" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">纠正优先级高于模型判断（同 ④ 层逻辑）</text>
<rect x="40" y="496" width="980" height="316" rx="10" fill="#FDF6F4" stroke="#A8452F" stroke-width="1" opacity="1"/>
<text x="56" y="522" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#A8452F" text-anchor="start" letter-spacing="0">④ 危机接管（需求 37）：T1/T2/T3 三档，行为不同不是话术不同</text>
<rect x="56" y="552" width="948" height="72" rx="10" fill="#FFFFFF" stroke="#A9B7C5" stroke-width="1" opacity="1"/>
<rect x="56" y="552" width="4" height="72" rx="2" fill="#2F6F7E" stroke="#2F6F7E" stroke-width="0" opacity="1"/>
<text x="74" y="578" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#2F6F7E" text-anchor="start" letter-spacing="0">T1 关注</text>
<text x="150" y="578" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">表达低落但无风险信号</text>
<text x="74" y="604" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.4" font-weight="normal" fill="#3C5A78" text-anchor="start" letter-spacing="0">注入三轴，正常对话，缩短回复、不加追问</text>
<rect x="56" y="636" width="948" height="72" rx="10" fill="#FFFFFF" stroke="#A9B7C5" stroke-width="1" opacity="1"/>
<rect x="56" y="636" width="4" height="72" rx="2" fill="#C7763F" stroke="#C7763F" stroke-width="0" opacity="1"/>
<text x="74" y="662" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#C7763F" text-anchor="start" letter-spacing="0">T2 提示</text>
<text x="150" y="662" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">出现风险暗示（措辞模糊）</text>
<text x="74" y="688" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.4" font-weight="normal" fill="#3C5A78" text-anchor="start" letter-spacing="0">表留空：不填危机类型；给资源入口，继续对话</text>
<rect x="56" y="720" width="948" height="72" rx="10" fill="#FFFFFF" stroke="#A9B7C5" stroke-width="1" opacity="1"/>
<rect x="56" y="720" width="4" height="72" rx="2" fill="#A8452F" stroke="#A8452F" stroke-width="0" opacity="1"/>
<text x="74" y="746" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#A8452F" text-anchor="start" letter-spacing="0">T3 硬停</text>
<text x="150" y="746" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">明确自伤/伤人意图</text>
<text x="74" y="772" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.4" font-weight="normal" fill="#3C5A78" text-anchor="start" letter-spacing="0">不进 Agent：直接给热线与线下资源，本会话不再走生成</text>
<text x="56" y="800" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.6" font-weight="600" fill="#A8452F" text-anchor="start" letter-spacing="0">铁律：不写「已联络紧急联系人」字段——联络不了。只留 escalation_note 记录真实做过的事。</text>
<rect x="1040" y="496" width="540" height="316" rx="10" fill="#FFFFFF" stroke="#A9B7C5" stroke-width="1" opacity="1"/>
<text x="1056" y="522" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#647788" text-anchor="start" letter-spacing="0">三条不许做的事（都会让「有人味」变味）</text>
<text x="1056" y="544" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.4" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">① 不许把「共情」做成一句固定开场白（模板感 = 假）</text>
<text x="1056" y="570" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.4" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">② 不许用性格设置掩盖能力缺口（「我记性不好」不能当借口）</text>
<text x="1056" y="596" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.4" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">③ 不许在危机里继续扮演角色（T3 时人设让位于安全）</text>
<text x="1056" y="622" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.4" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0"></text>
<text x="1056" y="648" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.4" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">反例：用户说「我妈走了」，回「我理解你的感受，想聊聊吗？」</text>
<text x="1056" y="674" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.4" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">→ 空转共情。正解：先承认、再留白、不追问细节。</text>
<rect x="40" y="840" width="1480" height="60" rx="10" fill="#F3F6FA" stroke="#DDE4EB" stroke-width="1" opacity="1"/>
<text x="60" y="868" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#16324F" text-anchor="start" letter-spacing="0">一句话：有人味 = 记得住（B5）+ 会接情绪（B7）+ 不装（无 confidence、不编人设、不写已推送）。</text>
</g>
</svg>
