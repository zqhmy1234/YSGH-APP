<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="718" viewBox="0 0 1440 718">
<defs><marker id="ah-ink" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#16324F"/></marker><marker id="ah-teal" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2F6F7E"/></marker><marker id="ah-warm" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#C7763F"/></marker><marker id="ah-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#A9B7C5"/></marker><marker id="ah-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#A8452F"/></marker></defs>
<rect width="1440" height="718" fill="#FFFFFF"/>
<text x="40" y="46" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="26" font-weight="600" fill="#16324F" text-anchor="start" letter-spacing="0">11｜Provenance 的内部 Harness</text>
<text x="40" y="72" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="13" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">溯源与合规审计：只判，不写，不改稿</text>
<rect x="1226.92" y="26" width="173.08" height="30" rx="15" fill="#EAF2F4" stroke="#2F6F7E" stroke-width="1" opacity="1"/>
<text x="1313.46" y="46" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#2F6F7E" text-anchor="middle" letter-spacing="0">触发式｜轻量｜≈50 ms</text>
<rect x="40" y="104" width="320" height="512" rx="10" fill="#F3F6FA" stroke="#A9B7C5" stroke-width="1" opacity="1"/>
<text x="54" y="130" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#16324F" text-anchor="start" letter-spacing="0">谁能调它 · 触发 · 读什么</text>
<text x="54" y="167" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#A8452F" text-anchor="start" letter-spacing="0">调用者</text>
<text x="54" y="202" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.6" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">应用层；由 Muse 的输出触发，不由 Muse 调用</text>
<text x="54" y="233" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#A8452F" text-anchor="start" letter-spacing="0">触发（四类，其余不跑）</text>
<text x="54" y="268" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.6" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">引用私料 / 敏感话题 / 用户纠错 / 危机词</text>
<text x="54" y="299" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#A8452F" text-anchor="start" letter-spacing="0">读什么</text>
<text x="54" y="334" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.6" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">回复草稿 + 参考块 provenance</text>
<text x="54" y="365" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.6" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">禁语表 + 人设卡 + 情绪契约</text>
<text x="54" y="396" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#A8452F" text-anchor="start" letter-spacing="0">不读什么</text>
<text x="54" y="431" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.6" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">原始文件字节；其他用户数据</text>
<rect x="380" y="104" width="660" height="512" rx="10" fill="#FFFFFF" stroke="#A9B7C5" stroke-width="1" opacity="1"/>
<text x="394" y="130" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#16324F" text-anchor="start" letter-spacing="0">内部 Harness 五件套</text>
<rect x="392" y="148" width="636" height="62" rx="5" fill="#F3F6FA" stroke="#A9B7C5" stroke-width="1" opacity="1"/>
<rect x="392" y="148" width="3" height="62" rx="1" fill="#A8452F" stroke="#A8452F" stroke-width="0" opacity="1"/>
<text x="406" y="170" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11.2" font-weight="600" fill="#A8452F" text-anchor="start" letter-spacing="0">① 角色</text>
<text x="406" y="188" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">审计员：给出 verdict 与依据，不生成任何回复文本</text>
<rect x="392" y="220.0" width="636" height="102" rx="5" fill="#F3F6FA" stroke="#A9B7C5" stroke-width="1" opacity="1"/>
<rect x="392" y="220.0" width="3" height="102" rx="1" fill="#A8452F" stroke="#A8452F" stroke-width="0" opacity="1"/>
<text x="406" y="242.0" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11.2" font-weight="600" fill="#A8452F" text-anchor="start" letter-spacing="0">② 工具</text>
<text x="406" y="260.0" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">证据匹配（card_id → 参考块）</text>
<text x="406" y="280.0" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">禁语/共情规则匹配</text>
<text x="406" y="300.0" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">人设一致性规则</text>
<rect x="392" y="332.0" width="636" height="82" rx="5" fill="#F3F6FA" stroke="#A9B7C5" stroke-width="1" opacity="1"/>
<rect x="392" y="332.0" width="3" height="82" rx="1" fill="#A8452F" stroke="#A8452F" stroke-width="0" opacity="1"/>
<text x="406" y="354.0" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11.2" font-weight="600" fill="#A8452F" text-anchor="start" letter-spacing="0">③ 内存视图</text>
<text x="406" y="372.0" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">本轮证据集（只读，不跨轮）</text>
<text x="406" y="392.0" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">不缓存历史判定结果（防陈旧豁免）</text>
<rect x="392" y="424.0" width="636" height="82" rx="5" fill="#F3F6FA" stroke="#A9B7C5" stroke-width="1" opacity="1"/>
<rect x="392" y="424.0" width="3" height="82" rx="1" fill="#A8452F" stroke="#A8452F" stroke-width="0" opacity="1"/>
<text x="406" y="446.0" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11.2" font-weight="600" fill="#A8452F" text-anchor="start" letter-spacing="0">④ 约束</text>
<text x="406" y="464.0" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">不得改动草稿、不得替模型补写</text>
<text x="406" y="484.0" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">每次判定必须给理由（可审计）</text>
<rect x="392" y="516.0" width="636" height="82" rx="5" fill="#F3F6FA" stroke="#A9B7C5" stroke-width="1" opacity="1"/>
<rect x="392" y="516.0" width="3" height="82" rx="1" fill="#A8452F" stroke="#A8452F" stroke-width="0" opacity="1"/>
<text x="406" y="538.0" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11.2" font-weight="600" fill="#A8452F" text-anchor="start" letter-spacing="0">⑤ 循环与预算</text>
<text x="406" y="556.0" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">一次判定：pass / retry / block</text>
<text x="406" y="576.0" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">retry 最多 1 次，第二次必降级</text>
<rect x="1060" y="104" width="340" height="162.66666666666666" rx="10" fill="#FFFFFF" stroke="#A9B7C5" stroke-width="1" opacity="1"/>
<text x="1074" y="128" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11.2" font-weight="600" fill="#16324F" text-anchor="start" letter-spacing="0">输出契约</text>
<text x="1074" y="152" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">verdict：pass | retry | block</text>
<text x="1074" y="173" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">violations[]（禁语/无证据/OOC）</text>
<text x="1074" y="194" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">依据：命中的 card_id 与规则 id</text>
<rect x="1060" y="278.66666666666663" width="340" height="162.66666666666666" rx="10" fill="#FFFFFF" stroke="#A9B7C5" stroke-width="1" opacity="1"/>
<text x="1074" y="302.66666666666663" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11.2" font-weight="600" fill="#A8452F" text-anchor="start" letter-spacing="0">失败语义（三态以上）</text>
<text x="1074" y="326.66666666666663" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">私料无证据 → block（fail-closed）</text>
<text x="1074" y="347.66666666666663" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">普通共情不足 → fail-open，不阻断回复</text>
<text x="1074" y="368.66666666666663" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">自身不可用 → 仅私料场景阻断</text>
<rect x="1060" y="453.33333333333326" width="340" height="162.66666666666666" rx="10" fill="#F8EEE7" stroke="#C7763F" stroke-width="1" opacity="1"/>
<text x="1074" y="477.33333333333326" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11.2" font-weight="600" fill="#16324F" text-anchor="start" letter-spacing="0">成本档与队列</text>
<text x="1074" y="501.33333333333326" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">轻量；≈50 ms</text>
<text x="1074" y="522.3333333333333" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">只对触发轮计费，非每轮</text>
<text x="1074" y="543.3333333333333" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">与生成并行不可行：必须在生成后</text>
<rect x="40" y="638" width="1360" height="54" rx="10" fill="#F3F6FA" stroke="#DDE4EB" stroke-width="1" opacity="1"/>
<text x="56" y="662" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.8" font-weight="normal" fill="#3C5A78" text-anchor="start" letter-spacing="0">与 Linger 的差异：Linger 每轮都审；我们改触发式省成本，但把「私料无证据」从 warn 升为 block——这是产品红线。</text>
</svg>
