<svg xmlns="http://www.w3.org/2000/svg" width="1620" height="1620" viewBox="0 0 1620 1620">
<defs><marker id="ah-ink" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#16324F"/></marker><marker id="ah-teal" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2F6F7E"/></marker><marker id="ah-warm" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#C7763F"/></marker><marker id="ah-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#A9B7C5"/></marker><marker id="ah-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#A8452F"/></marker></defs>
<rect width="1620" height="1620" fill="#FFFFFF"/>
<g transform="translate(0.0,320.0)">
<text x="40" y="46" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="26" font-weight="600" fill="#16324F" text-anchor="start" letter-spacing="0">B5 记忆｜四层物理隔离（这是「记得住事」的地基）</text>
<text x="40" y="72" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="13" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">分层不是为了整洁，是为了让「用户改的那一句」永远压过「模型猜的那一堆」</text>
<rect x="1507.36" y="26" width="72.64" height="30" rx="15" fill="#EAF2F4" stroke="#2F6F7E" stroke-width="1" opacity="1"/>
<text x="1543.68" y="46" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#2F6F7E" text-anchor="middle" letter-spacing="0">图 15</text>
<rect x="30" y="112" width="1540" height="46" rx="10" fill="#F3F6FA" stroke="#DDE4EB" stroke-width="1" opacity="1"/>
<text x="42" y="142" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.8" font-weight="600" fill="#16324F" text-anchor="start" letter-spacing="0">层</text>
<text x="252" y="142" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.8" font-weight="600" fill="#16324F" text-anchor="start" letter-spacing="0">存什么</text>
<text x="552" y="142" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.8" font-weight="600" fill="#16324F" text-anchor="start" letter-spacing="0">写入者</text>
<text x="772" y="142" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.8" font-weight="600" fill="#16324F" text-anchor="start" letter-spacing="0">读取者</text>
<text x="932" y="142" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.8" font-weight="600" fill="#16324F" text-anchor="start" letter-spacing="0">存储</text>
<text x="1272" y="142" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.8" font-weight="600" fill="#16324F" text-anchor="start" letter-spacing="0">保留 / 优先级</text>
<rect x="30" y="158" width="1540" height="92" rx="10" fill="#FFFFFF" stroke="#A9B7C5" stroke-width="1" opacity="1"/>
<rect x="30" y="158" width="5" height="92" rx="2" fill="#2F6F7E" stroke="#2F6F7E" stroke-width="0" opacity="1"/>
<text x="42" y="194" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#2F6F7E" text-anchor="start" letter-spacing="0">① 叙事陪伴记忆</text>
<text x="252" y="190" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">对话事件、印象、故事线</text>
<text x="252" y="209" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">段落、情绪脉络</text>
<text x="552" y="190" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">Sculptor（离线整理）</text>
<text x="552" y="209" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">Muse 提案</text>
<text x="772" y="190" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">Muse / Librarian</text>
<text x="932" y="190" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">PG memory_episode</text>
<text x="932" y="209" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">+ Qdrant</text>
<text x="1272" y="190" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">长期，可摘要压缩</text>
<rect x="30" y="250" width="1540" height="92" rx="10" fill="#FFFFFF" stroke="#A9B7C5" stroke-width="1" opacity="1"/>
<rect x="30" y="250" width="5" height="92" rx="2" fill="#C7763F" stroke="#C7763F" stroke-width="0" opacity="1"/>
<text x="42" y="286" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#C7763F" text-anchor="start" letter-spacing="0">② 用户事实记忆</text>
<text x="252" y="282" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">称呼、家人、人生阶段、</text>
<text x="252" y="301" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">偏好、重要日期</text>
<text x="552" y="282" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">画像标注 + 用户确认</text>
<text x="772" y="282" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">ProfileDigest 投影</text>
<text x="932" y="282" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">PG user_profile</text>
<text x="932" y="301" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">+ profile_dimension_history</text>
<text x="1272" y="282" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">长期；双时序</text>
<text x="1272" y="301" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">（旧行不覆盖，只关闭）</text>
<rect x="30" y="342" width="1540" height="92" rx="10" fill="#FFFFFF" stroke="#A9B7C5" stroke-width="1" opacity="1"/>
<rect x="30" y="342" width="5" height="92" rx="2" fill="#3C5A78" stroke="#3C5A78" stroke-width="0" opacity="1"/>
<text x="42" y="378" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#3C5A78" text-anchor="start" letter-spacing="0">③ 资产索引</text>
<text x="252" y="374" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">素材元数据、caption、</text>
<text x="252" y="393" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">向量</text>
<text x="552" y="374" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">摄入管线</text>
<text x="772" y="374" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">检索（Librarian）</text>
<text x="932" y="374" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">PG + Qdrant + COS</text>
<text x="1272" y="374" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">随内容生命周期；删除即清</text>
<rect x="30" y="434" width="1540" height="92" rx="10" fill="#FFFFFF" stroke="#A9B7C5" stroke-width="1" opacity="1"/>
<rect x="30" y="434" width="5" height="92" rx="2" fill="#A8452F" stroke="#A8452F" stroke-width="0" opacity="1"/>
<text x="42" y="470" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#A8452F" text-anchor="start" letter-spacing="0">④ 偏好与修正记忆</text>
<text x="252" y="466" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">雷区、AI 性格、情绪解释</text>
<text x="252" y="485" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">开关、用户纠错</text>
<text x="552" y="466" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">用户显式操作（唯一来源）</text>
<text x="772" y="466" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">全局，先于任何生成</text>
<text x="932" y="466" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">PG preferences /</text>
<text x="932" y="485" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">correction_log / user_ai_persona</text>
<text x="1272" y="466" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">永久，优先级最高（压过①②③）</text>
<rect x="30" y="600" width="780" height="190" rx="10" fill="#FDF6F4" stroke="#A8452F" stroke-width="1" opacity="1"/>
<text x="46" y="626" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#A8452F" text-anchor="start" letter-spacing="0">读的时候，顺序是反的（④ → ② → ① → ③）</text>
<text x="46" y="646" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.6" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">1. 先读 ④ 偏好与修正：用户说「别提我爸」——这句必须先于任何候选生效；</text>
<text x="46" y="670" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.6" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">2. 再读 ② 用户事实：称呼、人生阶段、重要日期（谁是「妈妈」不能靠猜）；</text>
<text x="46" y="694" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.6" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">3. 再读 ① 叙事记忆：事件卡与故事线段落（「那次吃火锅」）；</text>
<text x="46" y="718" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.6" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">4. 最后读 ③ 资产索引：原文只在被引用时取，且必须带 card_id。</text>
<text x="46" y="772" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.6" font-weight="600" fill="#16324F" text-anchor="start" letter-spacing="0">四条合计装进上下文帧；画像投影硬上限 600 字——超了先砍 ①，永不砍 ④。</text>
<rect x="840" y="600" width="750" height="190" rx="10" fill="#EAF2F4" stroke="#2F6F7E" stroke-width="1" opacity="1"/>
<text x="856" y="626" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#2F6F7E" text-anchor="start" letter-spacing="0">B5 参考了谁（借 schema，不引依赖）</text>
<text x="856" y="642" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.4" font-weight="600" fill="#3C5A78" text-anchor="start" letter-spacing="0">Zep / Graphiti（94.7%，双时序）</text>
<text x="1108" y="642" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.4" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">→ 借双时序边 valid_from / valid_to / recorded_at</text>
<text x="856" y="668" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.4" font-weight="600" fill="#3C5A78" text-anchor="start" letter-spacing="0">Mem0（92.5%，事实抽取）</text>
<text x="1108" y="668" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.4" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">→ 借「抽取-合并」，事实归一，落地自己写，不接服务</text>
<text x="856" y="694" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.4" font-weight="600" fill="#3C5A78" text-anchor="start" letter-spacing="0">Linger（95%，五 Agent）</text>
<text x="1108" y="694" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.4" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">→ 借两阶段写：模型只提案，写权在端口，原始不改</text>
<text x="856" y="724" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="600" fill="#16324F" text-anchor="start" letter-spacing="0">四层划分是我们自己的：对应「陪伴 / 事实 / 资产 / 修正」四种寿命与权限。</text>
<text x="856" y="752" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#A8452F" text-anchor="start" letter-spacing="0">ADR 判负：不引 Neo4j / Graphiti 服务 / Mem0 服务 / Letta / TELOS。</text>
<text x="856" y="774" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">落地：PG 28 表 10 域 + Qdrant named vectors；MemoryPort 是端口，不是库。</text>
<text x="30" y="852" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#A8452F" text-anchor="start" letter-spacing="0">唯一铁律：用户改过的那一句（④）永远压过模型推断的任何东西（①②③）。</text>
<text x="30" y="878" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">容量淘汰不碰用户资产：遗忘只由 TTL（低价值闲聊）、用户删除、合规删除触发；存不下就扩，不许「删旧的腾地方」。</text>
<text x="30" y="906" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#2F6F7E" text-anchor="start" letter-spacing="0">三条对应门禁：G4（写三态）/ G5（双时序不覆盖）/ G7（备份 RPO≤24h 与四层 purge 可证）。</text>
</g>
</svg>
