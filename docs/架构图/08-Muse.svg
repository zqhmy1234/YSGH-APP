<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="718" viewBox="0 0 1440 718">
<defs><marker id="ah-ink" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#16324F"/></marker><marker id="ah-teal" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2F6F7E"/></marker><marker id="ah-warm" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#C7763F"/></marker><marker id="ah-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#A9B7C5"/></marker><marker id="ah-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#A8452F"/></marker></defs>
<rect width="1440" height="718" fill="#FFFFFF"/>
<text x="40" y="46" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="26" font-weight="600" fill="#16324F" text-anchor="start" letter-spacing="0">08｜Muse 的内部 Harness</text>
<text x="40" y="72" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="13" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">主生成：唯一出话的那只，也是唯一没有写权限的那只</text>
<rect x="1226.92" y="26" width="173.08" height="30" rx="15" fill="#EAF2F4" stroke="#2F6F7E" stroke-width="1" opacity="1"/>
<text x="1313.46" y="46" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#2F6F7E" text-anchor="middle" letter-spacing="0">必跑｜主力模型｜1–4 s</text>
<rect x="40" y="104" width="320" height="512" rx="10" fill="#F3F6FA" stroke="#A9B7C5" stroke-width="1" opacity="1"/>
<text x="54" y="130" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#16324F" text-anchor="start" letter-spacing="0">谁能调它 · 触发 · 读什么</text>
<text x="54" y="167" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#C7763F" text-anchor="start" letter-spacing="0">调用者</text>
<text x="54" y="202" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.6" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">应用层转发；其余 Agent 不得直调</text>
<text x="54" y="233" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#C7763F" text-anchor="start" letter-spacing="0">触发</text>
<text x="54" y="268" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.6" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">每一轮，无例外</text>
<text x="54" y="299" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#C7763F" text-anchor="start" letter-spacing="0">读什么</text>
<text x="54" y="334" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.6" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">上下文帧九段（只读快照）</text>
<text x="54" y="365" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.6" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">参考事件卡（带 card_id 与溯源）</text>
<text x="54" y="396" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#C7763F" text-anchor="start" letter-spacing="0">不读什么</text>
<text x="54" y="431" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.6" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">原始文件 / 人脸结论 / 他人 Agent 内部状态</text>
<text x="54" y="462" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.6" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">后台队列与运维指标</text>
<rect x="380" y="104" width="660" height="512" rx="10" fill="#FFFFFF" stroke="#A9B7C5" stroke-width="1" opacity="1"/>
<text x="394" y="130" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#16324F" text-anchor="start" letter-spacing="0">内部 Harness 五件套</text>
<rect x="392" y="148" width="636" height="82" rx="5" fill="#F3F6FA" stroke="#A9B7C5" stroke-width="1" opacity="1"/>
<rect x="392" y="148" width="3" height="82" rx="1" fill="#C7763F" stroke="#C7763F" stroke-width="0" opacity="1"/>
<text x="406" y="170" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11.2" font-weight="600" fill="#C7763F" text-anchor="start" letter-spacing="0">① 角色与提示</text>
<text x="406" y="188" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">人设卡版本快照（memory_companion / grandchild_proxy 等）</text>
<text x="406" y="208" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">全局约束：禁编造、禁诊断、禁说教、禁报分数与文件名</text>
<rect x="392" y="240.0" width="636" height="82" rx="5" fill="#F3F6FA" stroke="#A9B7C5" stroke-width="1" opacity="1"/>
<rect x="392" y="240.0" width="3" height="82" rx="1" fill="#C7763F" stroke="#C7763F" stroke-width="0" opacity="1"/>
<text x="406" y="262.0" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11.2" font-weight="600" fill="#C7763F" text-anchor="start" letter-spacing="0">② 可用工具</text>
<text x="406" y="280.0" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">无任何写入类工具（不建表、不删、不改）</text>
<text x="406" y="300.0" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">只可产「建议卡」：打开时间轴 / 按人找 / 分享入口</text>
<rect x="392" y="332.0" width="636" height="82" rx="5" fill="#F3F6FA" stroke="#A9B7C5" stroke-width="1" opacity="1"/>
<rect x="392" y="332.0" width="3" height="82" rx="1" fill="#C7763F" stroke="#C7763F" stroke-width="0" opacity="1"/>
<text x="406" y="354.0" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11.2" font-weight="600" fill="#C7763F" text-anchor="start" letter-spacing="0">③ 内存视图</text>
<text x="406" y="372.0" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">窗口内对话 + 画像投影（≤600 字）+ 参考块</text>
<text x="406" y="392.0" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">看不到原始文件、向量、其他人格与后台状态</text>
<rect x="392" y="424.0" width="636" height="82" rx="5" fill="#F3F6FA" stroke="#A9B7C5" stroke-width="1" opacity="1"/>
<rect x="392" y="424.0" width="3" height="82" rx="1" fill="#C7763F" stroke="#C7763F" stroke-width="0" opacity="1"/>
<text x="406" y="446.0" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11.2" font-weight="600" fill="#C7763F" text-anchor="start" letter-spacing="0">④ 约束与闸</text>
<text x="406" y="464.0" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">参考块只读；引用必须带 card_id，否则后置校验必拦</text>
<text x="406" y="484.0" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">禁语清单内联进提示，不靠模型自觉</text>
<rect x="392" y="516.0" width="636" height="82" rx="5" fill="#F3F6FA" stroke="#A9B7C5" stroke-width="1" opacity="1"/>
<rect x="392" y="516.0" width="3" height="82" rx="1" fill="#C7763F" stroke="#C7763F" stroke-width="0" opacity="1"/>
<text x="406" y="538.0" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11.2" font-weight="600" fill="#C7763F" text-anchor="start" letter-spacing="0">⑤ 循环与预算</text>
<text x="406" y="556.0" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">单轮生成 + state 提案；不做多步 plan、不自我反思</text>
<text x="406" y="576.0" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">最多一次重试（仅由 Provenance 判定 retry 触发）</text>
<rect x="1060" y="104" width="340" height="176.66666666666666" rx="10" fill="#FFFFFF" stroke="#A9B7C5" stroke-width="1" opacity="1"/>
<text x="1074" y="128" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11.2" font-weight="600" fill="#16324F" text-anchor="start" letter-spacing="0">输出契约</text>
<text x="1074" y="152" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">自然语言回复（流式）</text>
<text x="1074" y="173" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">引用标记 card_id[]</text>
<text x="1074" y="194" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">state 提案（tone / familiarity / arc）</text>
<text x="1074" y="215" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">可选：建议卡（跳转/分享）</text>
<rect x="1060" y="292.66666666666663" width="340" height="155.66666666666666" rx="10" fill="#FFFFFF" stroke="#A9B7C5" stroke-width="1" opacity="1"/>
<text x="1074" y="316.66666666666663" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11.2" font-weight="600" fill="#A8452F" text-anchor="start" letter-spacing="0">失败语义（三态以上）</text>
<text x="1074" y="340.66666666666663" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">超时 → 模板化安全回复（不假装思考）</text>
<text x="1074" y="361.66666666666663" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">state 解析失败 → 落 draft，不重试整轮</text>
<text x="1074" y="382.66666666666663" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">OOC / 禁语命中 → 重试一次 → 仍命中则短回应</text>
<rect x="1060" y="460.33333333333326" width="340" height="155.66666666666666" rx="10" fill="#F8EEE7" stroke="#C7763F" stroke-width="1" opacity="1"/>
<text x="1074" y="484.33333333333326" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11.2" font-weight="600" fill="#16324F" text-anchor="start" letter-spacing="0">成本档与队列</text>
<text x="1074" y="508.33333333333326" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">主力模型：1–4 s（唯一不可省）</text>
<text x="1074" y="529.3333333333333" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">与召回并行：首字可在召回后立即吐出</text>
<text x="1074" y="550.3333333333333" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">单轮只调一次</text>
<rect x="40" y="638" width="1360" height="54" rx="10" fill="#F3F6FA" stroke="#DDE4EB" stroke-width="1" opacity="1"/>
<text x="56" y="662" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.8" font-weight="normal" fill="#3C5A78" text-anchor="start" letter-spacing="0">与 Linger 的差异：Linger 的 Muse 负责对话并提名记忆；我们保留提名，但把「写」彻底剥到 MemoryWritePort，模型连重试都无权发起。</text>
</svg>
