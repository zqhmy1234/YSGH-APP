<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="880" viewBox="0 0 1600 880">
<defs><marker id="ah-ink" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#16324F"/></marker><marker id="ah-teal" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2F6F7E"/></marker><marker id="ah-warm" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#C7763F"/></marker><marker id="ah-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#A9B7C5"/></marker><marker id="ah-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#A8452F"/></marker></defs>
<rect width="1600" height="880" fill="#FFFFFF"/>
<text x="40" y="46" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="26" font-weight="600" fill="#16324F" text-anchor="start" letter-spacing="0">五 Agent 的 Harness：Linger 的范式与我们落地后的偏离</text>
<text x="40" y="72" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="13" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">左：公开描述的 Linger 结构｜中：我们完全照搬的部分｜右：我们刻意改掉的五处</text>
<rect x="1487.36" y="26" width="72.64" height="30" rx="15" fill="#EAF2F4" stroke="#2F6F7E" stroke-width="1" opacity="1"/>
<text x="1523.68" y="46" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#2F6F7E" text-anchor="middle" letter-spacing="0">图 07</text>
<rect x="40" y="108" width="520" height="660" rx="10" fill="#F3F6FA" stroke="#A9B7C5" stroke-width="1" opacity="1"/>
<text x="56" y="136" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#16324F" text-anchor="start" letter-spacing="0">Linger（LoCoMo 95% 公开描述的范式）</text>
<text x="56" y="158" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">复述性质，细节以其仓库/论文为准</text>
<rect x="56" y="176" width="488" height="52" rx="6" fill="#FFFFFF" stroke="#A9B7C5" stroke-width="1" opacity="1"/>
<text x="70" y="208" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#3C5A78" text-anchor="start" letter-spacing="0">用户输入（文本）</text>
<line x1="300.0" y1="228" x2="300.0" y2="252" stroke="#16324F" stroke-width="1.6" marker-end="url(#ah-ink)"/>
<rect x="56" y="252" width="488" height="86" rx="6" fill="#EAF2F4" stroke="#2F6F7E" stroke-width="1" opacity="1"/>
<text x="70" y="278" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#16324F" text-anchor="start" letter-spacing="0">应用层（Application Layer）</text>
<text x="70" y="300" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" fill="#2F6F7E" text-anchor="start" letter-spacing="0">仲裁 · 权限 · 上下文预算 · 转发</text>
<text x="70" y="320" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">Agent 之间不直连</text>
<line x1="300.0" y1="338" x2="300.0" y2="360" stroke="#2F6F7E" stroke-width="1.6" marker-end="url(#ah-teal)"/>
<rect x="56" y="360" width="488" height="36" rx="6" fill="#FFFFFF" stroke="#C7763F" stroke-width="1" opacity="1"/>
<text x="70" y="383" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11" font-weight="500" fill="#3C5A78" text-anchor="start" letter-spacing="0">Muse｜对话主生成</text>
<rect x="56" y="404" width="488" height="36" rx="6" fill="#FFFFFF" stroke="#A9B7C5" stroke-width="1" opacity="1"/>
<text x="70" y="427" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11" font-weight="500" fill="#3C5A78" text-anchor="start" letter-spacing="0">Librarian｜检索</text>
<rect x="56" y="448" width="488" height="36" rx="6" fill="#FFFFFF" stroke="#A9B7C5" stroke-width="1" opacity="1"/>
<text x="70" y="471" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11" font-weight="500" fill="#3C5A78" text-anchor="start" letter-spacing="0">Serendipity｜记忆召回</text>
<rect x="56" y="492" width="488" height="36" rx="6" fill="#FFFFFF" stroke="#A9B7C5" stroke-width="1" opacity="1"/>
<text x="70" y="515" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11" font-weight="500" fill="#3C5A78" text-anchor="start" letter-spacing="0">Provenance｜溯源校验</text>
<rect x="56" y="536" width="488" height="36" rx="6" fill="#FFFFFF" stroke="#A9B7C5" stroke-width="1" opacity="1"/>
<text x="70" y="559" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11" font-weight="500" fill="#3C5A78" text-anchor="start" letter-spacing="0">Sculptor｜离线整理</text>
<line x1="300.0" y1="580" x2="300.0" y2="606" stroke="#16324F" stroke-width="1.6" marker-end="url(#ah-ink)"/>
<rect x="56" y="606" width="488" height="150" rx="6" fill="#FFFFFF" stroke="#A9B7C5" stroke-width="1" opacity="1"/>
<text x="70" y="632" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#16324F" text-anchor="start" letter-spacing="0">记忆两阶段写入</text>
<text x="70" y="656" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">Muse 提名 → Provenance 审核 →</text>
<text x="70" y="676" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">应用层统一落库（模型无写权）</text>
<text x="70" y="704" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" fill="#2F6F7E" text-anchor="start" letter-spacing="0">原始记录不可覆盖；整理只加新层</text>
<text x="70" y="728" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">（Sculptor 负责摘要 / 分组 / 链接）</text>
<rect x="596" y="108" width="400" height="660" rx="10" fill="#FFFFFF" stroke="#A9B7C5" stroke-width="1" opacity="1"/>
<text x="612" y="136" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#2F6F7E" text-anchor="start" letter-spacing="0">我们完全照搬的四点</text>
<rect x="612" y="172" width="368" height="116" rx="6" fill="#F3F6FA" stroke="#A9B7C5" stroke-width="1" opacity="1"/>
<text x="626" y="200" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#16324F" text-anchor="start" letter-spacing="0">五角色分工不变</text>
<text x="626" y="228" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">谁取料、谁出话、谁预取、</text>
<text x="626" y="250" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">谁审、谁整理，职责不混</text>
<rect x="612" y="322" width="368" height="116" rx="6" fill="#F3F6FA" stroke="#A9B7C5" stroke-width="1" opacity="1"/>
<text x="626" y="350" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#16324F" text-anchor="start" letter-spacing="0">应用层仲裁</text>
<text x="626" y="378" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">Agent 不直连；越权与成本</text>
<text x="626" y="400" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">都在这一层被挡</text>
<rect x="612" y="472" width="368" height="116" rx="6" fill="#F3F6FA" stroke="#A9B7C5" stroke-width="1" opacity="1"/>
<text x="626" y="500" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#16324F" text-anchor="start" letter-spacing="0">提案 → 审核 → 落库</text>
<text x="626" y="528" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">模型只提案，写权在 App</text>
<text x="626" y="550" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">超时落 draft 不落 failed</text>
<rect x="612" y="622" width="368" height="116" rx="6" fill="#F3F6FA" stroke="#A9B7C5" stroke-width="1" opacity="1"/>
<text x="626" y="650" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#16324F" text-anchor="start" letter-spacing="0">原始不可覆盖</text>
<text x="626" y="678" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">整理只加可回滚的新层</text>
<text x="626" y="700" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">人设与原文永不被改写</text>
<rect x="1032" y="108" width="528" height="660" rx="10" fill="#FFFFFF" stroke="#C7763F" stroke-width="1" opacity="1"/>
<text x="1048" y="136" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#16324F" text-anchor="start" letter-spacing="0">我们刻意改掉的五处（以及为什么）</text>
<rect x="1048" y="166" width="496" height="100" rx="6" fill="#F8EEE7" stroke="#A9B7C5" stroke-width="1" opacity="1"/>
<text x="1062" y="192" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#16324F" text-anchor="start" letter-spacing="0">① Provenance 改触发式</text>
<text x="1062" y="216" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">Linger 每轮都审；我们只在引用私料 / 敏感 /</text>
<text x="1062" y="237" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">纠错 / 危机词时才审，省 3 次调用。</text>
<rect x="1048" y="286" width="496" height="100" rx="6" fill="#F8EEE7" stroke="#A9B7C5" stroke-width="1" opacity="1"/>
<text x="1062" y="312" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#16324F" text-anchor="start" letter-spacing="0">② 检索不再只有一路</text>
<text x="1062" y="336" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">Linger 一条 Library 检索；我们要三条通道同 filters、</text>
<text x="1062" y="357" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">三级降级、事件级返回，否则产品层搜不到。</text>
<rect x="1048" y="406" width="496" height="100" rx="6" fill="#F8EEE7" stroke="#A9B7C5" stroke-width="1" opacity="1"/>
<text x="1062" y="432" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#16324F" text-anchor="start" letter-spacing="0">③ 幻觉边界更硬</text>
<text x="1062" y="456" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">私料无溯源直接 block（fail-closed），</text>
<text x="1062" y="477" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">普通对话才 fail-open —— 这是产品红线不是折中。</text>
<rect x="1048" y="526" width="496" height="100" rx="6" fill="#F8EEE7" stroke="#A9B7C5" stroke-width="1" opacity="1"/>
<text x="1062" y="552" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#16324F" text-anchor="start" letter-spacing="0">④ 多出两个域</text>
<text x="1062" y="576" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">事件聚合（时间轴按事串）与回响调度（去年今日），</text>
<text x="1062" y="597" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">Linger 是对话型，没有这两个结构。</text>
<rect x="1048" y="646" width="496" height="100" rx="6" fill="#F8EEE7" stroke="#A9B7C5" stroke-width="1" opacity="1"/>
<text x="1062" y="672" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#16324F" text-anchor="start" letter-spacing="0">⑤ 记忆落地不引外部服务</text>
<text x="1062" y="696" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">抽象 MemoryPort，落地 PG + Qdrant；</text>
<text x="1062" y="717" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">借 Graphiti 的双时序列，不引 Neo4j。</text>
<text x="40" y="800" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#3C5A78" text-anchor="start" letter-spacing="0">一句话：我们抄的是 Linger 的「权限结构」，改的是它的「每轮成本」与「检索深度」——前者关乎安全，后者关乎产品能不能被用。</text>
</svg>
