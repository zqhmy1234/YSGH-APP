<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="698" viewBox="0 0 1440 698">
<defs><marker id="ah-ink" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#16324F"/></marker><marker id="ah-teal" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2F6F7E"/></marker><marker id="ah-warm" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#C7763F"/></marker><marker id="ah-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#A9B7C5"/></marker><marker id="ah-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#A8452F"/></marker></defs>
<rect width="1440" height="698" fill="#FFFFFF"/>
<text x="40" y="46" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="26" font-weight="600" fill="#16324F" text-anchor="start" letter-spacing="0">09｜Librarian 的内部 Harness</text>
<text x="40" y="72" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="13" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">检索编排：只交证据，不给结论</text>
<rect x="1171.12" y="26" width="228.88" height="30" rx="15" fill="#EAF2F4" stroke="#2F6F7E" stroke-width="1" opacity="1"/>
<text x="1285.56" y="46" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#2F6F7E" text-anchor="middle" letter-spacing="0">涉回忆时｜轻量｜100–300 ms</text>
<rect x="40" y="104" width="320" height="492" rx="10" fill="#F3F6FA" stroke="#A9B7C5" stroke-width="1" opacity="1"/>
<text x="54" y="130" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#16324F" text-anchor="start" letter-spacing="0">谁能调它 · 触发 · 读什么</text>
<text x="54" y="167" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#2F6F7E" text-anchor="start" letter-spacing="0">调用者</text>
<text x="54" y="202" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.6" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">应用层转发；Muse 不得直接检索</text>
<text x="54" y="233" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#2F6F7E" text-anchor="start" letter-spacing="0">触发</text>
<text x="54" y="268" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.6" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">意图②检索回忆、⑥混合引用私料</text>
<text x="54" y="299" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#2F6F7E" text-anchor="start" letter-spacing="0">读什么</text>
<text x="54" y="334" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.6" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">SearchPort（事件级检索）</text>
<text x="54" y="365" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.6" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">TimelinePort（接续讲述的上下文）</text>
<text x="54" y="396" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.6" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">PersonReadPort（按人过滤）</text>
<text x="54" y="427" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#2F6F7E" text-anchor="start" letter-spacing="0">不读什么</text>
<text x="54" y="462" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.6" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">画像 evidence（隐私降级）</text>
<text x="54" y="493" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.6" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">人脸识别的原始候选</text>
<rect x="380" y="104" width="660" height="492" rx="10" fill="#FFFFFF" stroke="#A9B7C5" stroke-width="1" opacity="1"/>
<text x="394" y="130" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#16324F" text-anchor="start" letter-spacing="0">内部 Harness 五件套</text>
<rect x="392" y="148" width="636" height="62" rx="5" fill="#F3F6FA" stroke="#A9B7C5" stroke-width="1" opacity="1"/>
<rect x="392" y="148" width="3" height="62" rx="1" fill="#2F6F7E" stroke="#2F6F7E" stroke-width="0" opacity="1"/>
<text x="406" y="170" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11.2" font-weight="600" fill="#2F6F7E" text-anchor="start" letter-spacing="0">① 角色</text>
<text x="406" y="188" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">检索编排者，不是回答者；不写一句自然语言回复</text>
<rect x="392" y="220.0" width="636" height="82" rx="5" fill="#F3F6FA" stroke="#A9B7C5" stroke-width="1" opacity="1"/>
<rect x="392" y="220.0" width="3" height="82" rx="1" fill="#2F6F7E" stroke="#2F6F7E" stroke-width="0" opacity="1"/>
<text x="406" y="242.0" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11.2" font-weight="600" fill="#2F6F7E" text-anchor="start" letter-spacing="0">② 工具</text>
<text x="406" y="260.0" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">search / timeline / person 过滤 / rerank</text>
<text x="406" y="280.0" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">resolve_query：filters 唯一一次归一（FACETS 注册表驱动）</text>
<rect x="392" y="312.0" width="636" height="82" rx="5" fill="#F3F6FA" stroke="#A9B7C5" stroke-width="1" opacity="1"/>
<rect x="392" y="312.0" width="3" height="82" rx="1" fill="#2F6F7E" stroke="#2F6F7E" stroke-width="0" opacity="1"/>
<text x="406" y="334.0" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11.2" font-weight="600" fill="#2F6F7E" text-anchor="start" letter-spacing="0">③ 内存视图</text>
<text x="406" y="352.0" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">近 3 轮检索缓存：同 query 不重复打库</text>
<text x="406" y="372.0" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">不保留跨会话结果（避免越权复用）</text>
<rect x="392" y="404.0" width="636" height="82" rx="5" fill="#F3F6FA" stroke="#A9B7C5" stroke-width="1" opacity="1"/>
<rect x="392" y="404.0" width="3" height="82" rx="1" fill="#2F6F7E" stroke="#2F6F7E" stroke-width="0" opacity="1"/>
<text x="406" y="426.0" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11.2" font-weight="600" fill="#2F6F7E" text-anchor="start" letter-spacing="0">④ 约束</text>
<text x="406" y="444.0" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">只返回证据，不生成结论；rewrite 必须留 diff 可回看</text>
<text x="406" y="464.0" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">不得静默丢分面（三条通道 filters 键集必须相同）</text>
<rect x="392" y="496.0" width="636" height="82" rx="5" fill="#F3F6FA" stroke="#A9B7C5" stroke-width="1" opacity="1"/>
<rect x="392" y="496.0" width="3" height="82" rx="1" fill="#2F6F7E" stroke="#2F6F7E" stroke-width="0" opacity="1"/>
<text x="406" y="518.0" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11.2" font-weight="600" fill="#2F6F7E" text-anchor="start" letter-spacing="0">⑤ 循环与预算</text>
<text x="406" y="536.0" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">单次检索 + 最多 2 轮放宽（记录 relaxed）</text>
<text x="406" y="556.0" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">两轮仍空 → 交降级链，不自行造答案</text>
<rect x="1060" y="104" width="340" height="170.0" rx="10" fill="#FFFFFF" stroke="#A9B7C5" stroke-width="1" opacity="1"/>
<text x="1074" y="128" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11.2" font-weight="600" fill="#16324F" text-anchor="start" letter-spacing="0">输出契约</text>
<text x="1074" y="152" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">EventCard[]（事件卡，非文件列表）</text>
<text x="1074" y="173" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">trace：命中分面 + 各通道得分</text>
<text x="1074" y="194" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">reason / relaxed[] / clarify</text>
<text x="1074" y="215" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">event_hit_count（同事件去重）</text>
<rect x="1060" y="286.0" width="340" height="149.0" rx="10" fill="#FFFFFF" stroke="#A9B7C5" stroke-width="1" opacity="1"/>
<text x="1074" y="310.0" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11.2" font-weight="600" fill="#A8452F" text-anchor="start" letter-spacing="0">失败语义（三态以上）</text>
<text x="1074" y="334.0" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">超时 → degraded=true，且禁止给 clarify</text>
<text x="1074" y="355.0" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">零命中 → 关键词 → clarify / 翻时间轴</text>
<text x="1074" y="376.0" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">通道 filters 不一致 → 门禁直接拦</text>
<rect x="1060" y="447.0" width="340" height="149.0" rx="10" fill="#F8EEE7" stroke="#C7763F" stroke-width="1" opacity="1"/>
<text x="1074" y="471.0" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11.2" font-weight="600" fill="#16324F" text-anchor="start" letter-spacing="0">成本档与队列</text>
<text x="1074" y="495.0" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">轻量模型 + 检索：100–300 ms</text>
<text x="1074" y="516.0" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">与 Person / Digest 并行发</text>
<text x="1074" y="537.0" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">队列：P0（前台）</text>
<rect x="40" y="618" width="1360" height="54" rx="10" fill="#F3F6FA" stroke="#DDE4EB" stroke-width="1" opacity="1"/>
<text x="56" y="642" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.8" font-weight="normal" fill="#3C5A78" text-anchor="start" letter-spacing="0">来源说明：RRF k=60 / alternates≤6 / 时间只投票不过滤 / 两列分离借自 Linger；多路检索、Qdrant 向量通道与 filters 门禁为本项目自加（上游明确无向量列）。</text>
