<svg xmlns="http://www.w3.org/2000/svg" width="1620" height="1620" viewBox="0 0 1620 1620">
<defs><marker id="ah-ink" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#16324F"/></marker><marker id="ah-teal" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2F6F7E"/></marker><marker id="ah-warm" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#C7763F"/></marker><marker id="ah-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#A9B7C5"/></marker><marker id="ah-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#A8452F"/></marker></defs>
<rect width="1620" height="1620" fill="#FFFFFF"/>
<g transform="translate(0.0,300.0)">
<text x="40" y="46" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="26" font-weight="600" fill="#16324F" text-anchor="start" letter-spacing="0">B5 记忆｜写进去与读出来：两阶段写 + 双时序 + 三态落地</text>
<text x="40" y="72" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="13" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">模型只提案；端口负责落；旧事实不覆盖只关闭；读的时候先读用户改的那句</text>
<rect x="1507.36" y="26" width="72.64" height="30" rx="15" fill="#EAF2F4" stroke="#2F6F7E" stroke-width="1" opacity="1"/>
<text x="1543.68" y="46" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#2F6F7E" text-anchor="middle" letter-spacing="0">图 16</text>
<rect x="30" y="112" width="760" height="420" rx="10" fill="#FFFFFF" stroke="#A9B7C5" stroke-width="1" opacity="1"/>
<text x="46" y="138" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#16324F" text-anchor="start" letter-spacing="0">写入路径（一次对话里发生的事）</text>
<rect x="46" y="152" width="728" height="66" rx="10" fill="#FFFFFF" stroke="#A9B7C5" stroke-width="1" opacity="1"/>
<rect x="46" y="152" width="4" height="66" rx="2" fill="#C7763F" stroke="#C7763F" stroke-width="0" opacity="1"/>
<text x="62" y="178" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.8" font-weight="600" fill="#C7763F" text-anchor="start" letter-spacing="0">① Muse 提案</text>
<text x="62" y="202" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.0" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">生成时附 state 提案：这段值不值得记、记成 episode 还是 fact</text>
<line x1="410" y1="218" x2="410" y2="228" stroke="#DDE4EB" stroke-width="1.6" marker-end="url(#ah-ink)"/>
<rect x="46" y="228" width="728" height="66" rx="10" fill="#FFFFFF" stroke="#A9B7C5" stroke-width="1" opacity="1"/>
<rect x="46" y="228" width="4" height="66" rx="2" fill="#A8452F" stroke="#A8452F" stroke-width="0" opacity="1"/>
<text x="62" y="254" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.8" font-weight="600" fill="#A8452F" text-anchor="start" letter-spacing="0">② Provenance 校验</text>
<text x="62" y="278" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.0" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">触发式：引用私料必须带 card_id；无证据 block；敏感走偏好层</text>
<line x1="410" y1="294" x2="410" y2="304" stroke="#DDE4EB" stroke-width="1.6" marker-end="url(#ah-ink)"/>
<rect x="46" y="304" width="728" height="66" rx="10" fill="#FFFFFF" stroke="#A9B7C5" stroke-width="1" opacity="1"/>
<rect x="46" y="304" width="4" height="66" rx="2" fill="#2F6F7E" stroke="#2F6F7E" stroke-width="0" opacity="1"/>
<text x="62" y="330" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.8" font-weight="600" fill="#2F6F7E" text-anchor="start" letter-spacing="0">③ MemoryWritePort</text>
<text x="62" y="354" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.0" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">三态：confirmed(200) / draft(超时或无 token) / rejected(护栏拒收)</text>
<line x1="410" y1="370" x2="410" y2="380" stroke="#DDE4EB" stroke-width="1.6" marker-end="url(#ah-ink)"/>
<rect x="46" y="380" width="728" height="66" rx="10" fill="#FFFFFF" stroke="#A9B7C5" stroke-width="1" opacity="1"/>
<rect x="46" y="380" width="4" height="66" rx="2" fill="#3C5A78" stroke="#3C5A78" stroke-width="0" opacity="1"/>
<text x="62" y="406" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.8" font-weight="600" fill="#3C5A78" text-anchor="start" letter-spacing="0">④ 落两处</text>
<text x="62" y="430" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.0" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">叙事片段 → memory_episode + Qdrant；事实 → user_profile 新行（旧行关闭）</text>
<line x1="410" y1="446" x2="410" y2="456" stroke="#DDE4EB" stroke-width="1.6" marker-end="url(#ah-ink)"/>
<rect x="46" y="456" width="728" height="66" rx="10" fill="#FFFFFF" stroke="#A9B7C5" stroke-width="1" opacity="1"/>
<rect x="46" y="456" width="4" height="66" rx="2" fill="#647788" stroke="#647788" stroke-width="0" opacity="1"/>
<text x="62" y="482" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.8" font-weight="600" fill="#647788" text-anchor="start" letter-spacing="0">⑤ Sculptor 夜间</text>
<text x="62" y="506" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.0" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">只加摘要层 / 主题分组 / 画像提案，永不改原文，幂等可回滚</text>
<rect x="820" y="112" width="770" height="420" rx="10" fill="#FDF6F4" stroke="#A8452F" stroke-width="1" opacity="1"/>
<text x="836" y="138" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#A8452F" text-anchor="start" letter-spacing="0">读出来：顺序 + 预算 + 三态</text>
<text x="846" y="158" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.6" font-weight="600" fill="#16324F" text-anchor="start" letter-spacing="0">顺序</text>
<text x="846" y="182" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.4" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">④ 偏好修正 → ② 用户事实 → ① 叙事记忆 → ③ 资产索引</text>
<text x="846" y="212" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.6" font-weight="600" fill="#16324F" text-anchor="start" letter-spacing="0">预算</text>
<text x="846" y="236" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.4" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">整帧硬上限；画像投影 ≤600 字（8 段结构）；超预算先砍 ① 的段落，再砍 ③ 的条数，④ 一字不砍</text>
<text x="846" y="272" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.6" font-weight="600" fill="#16324F" text-anchor="start" letter-spacing="0">ProfileDigestPort 三态（绝不空注入）</text>
<text x="866" y="296" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#2F6F7E" text-anchor="start" letter-spacing="0">ok               → 正常投影</text>
<text x="866" y="318" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#C7763F" text-anchor="start" letter-spacing="0">insufficient_data → 明确说「还不太了解你」，不编人设</text>
<text x="866" y="340" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">unavailable       → 降级为通用语气，且禁止给 clarify</text>
<text x="846" y="384" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="600" fill="#A8452F" text-anchor="start" letter-spacing="0">禁：把「没有画像」写成「你是一个温暖的人」（编造）</text>
<text x="846" y="408" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="600" fill="#A8452F" text-anchor="start" letter-spacing="0">禁：把 last-write-wins 用在偏好上（偏好是显式操作，不是最新闲聊）</text>
<text x="846" y="432" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="600" fill="#A8452F" text-anchor="start" letter-spacing="0">禁：把画像当事实库直接引原文（画像只放投影，原文要 card_id）</text>
<text x="846" y="462" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">画像丢 = 数月积累不可逆 → 备份 RPO ≤24h / WAL ≤5min（G7）</text>
<rect x="30" y="556" width="970" height="290" rx="10" fill="#F8EEE7" stroke="#C7763F" stroke-width="1" opacity="1"/>
<text x="46" y="582" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#C7763F" text-anchor="start" letter-spacing="0">双时序：事实变了不是「改」，是「关旧行 + 开新行」</text>
<text x="46" y="600" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.6" font-weight="600" fill="#3C5A78" text-anchor="start" letter-spacing="0">2024-05  用户说「想学游泳」</text>
<text x="46" y="622" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.0" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">行 A   valid_from=2024-05   valid_to=NULL   recorded_at=2024-05   source=对话</text>
<text x="46" y="652" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.6" font-weight="600" fill="#3C5A78" text-anchor="start" letter-spacing="0">2026-11  用户说「不想学了，改成跑步」</text>
<text x="46" y="674" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.0" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">行 A   valid_to=2026-11（关闭，不删）</text>
<text x="46" y="696" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.0" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">行 B   valid_from=2026-11   valid_to=NULL   recorded_at=2026-11   supersedes=行A.id</text>
<rect x="46" y="716" width="470" height="108" rx="10" fill="#F3F6FA" stroke="#A9B7C5" stroke-width="1" opacity="1"/>
<text x="60" y="740" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.3" font-weight="600" fill="#2F6F7E" text-anchor="start" letter-spacing="0">默认查询：读当前有效（valid_to IS NULL）</text>
<text x="60" y="762" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">→ 它现在说「在跑步」</text>
<rect x="526" y="716" width="456" height="108" rx="10" fill="#F3F6FA" stroke="#A9B7C5" stroke-width="1" opacity="1"/>
<text x="540" y="740" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.3" font-weight="600" fill="#2F6F7E" text-anchor="start" letter-spacing="0">历史问答：读当时有效</text>
<text x="540" y="762" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.0" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">valid_from ≤ T AND (valid_to &gt; T OR NULL)</text>
<text x="540" y="784" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.0" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">→ 能答「去年我是不是说想学游泳？」= 是</text>
<text x="46" y="838" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#3C5A78" text-anchor="start" letter-spacing="0">recorded_at 的意义：区分「事实何时成立」与「我们何时知道」——复盘时才不会把两件事混成一件。</text>
<rect x="1020" y="556" width="570" height="290" rx="10" fill="#EAF2F4" stroke="#2F6F7E" stroke-width="1" opacity="1"/>
<text x="1036" y="582" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#2F6F7E" text-anchor="start" letter-spacing="0">冲突与遗忘（裁决顺序写死）</text>
<text x="1036" y="600" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.4" font-weight="600" fill="#16324F" text-anchor="start" letter-spacing="0">冲突裁决：用户确认 &gt; 最新 &gt; 置信度高</text>
<text x="1036" y="624" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.1" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">三者都不满足 → 并列保留，标「待确认」，等用户点一次</text>
<text x="1036" y="646" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.1" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">宁多不忘：宁可留两条矛盾的，也不静默选一条</text>
<text x="1036" y="680" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.4" font-weight="600" fill="#A8452F" text-anchor="start" letter-spacing="0">遗忘只由三件事触发：</text>
<text x="1036" y="702" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.1" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">TTL（低价值闲聊）/ 用户删除 / 合规删除</text>
<text x="1036" y="724" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.1" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">不因容量淘汰；不因「模型觉得不重要」淘汰</text>
<text x="1036" y="756" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.1" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">待确认项在对话里以「一件小事」出现，不弹设置页</text>
<text x="1036" y="790" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="600" fill="#2F6F7E" text-anchor="start" letter-spacing="0">写入口三态：confirmed / draft / rejected</text>
<text x="1036" y="812" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.1" font-weight="normal" fill="#A8452F" text-anchor="start" letter-spacing="0">超时恒落 draft —— 超时不是 failed，真实终态未知</text>
<rect x="30" y="872" width="1560" height="112" rx="10" fill="#F3F6FA" stroke="#DDE4EB" stroke-width="1" opacity="1"/>
<text x="50" y="902" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#16324F" text-anchor="start" letter-spacing="0">一句话：记忆能力不是「存得多」，是「改得准、读得对、丢得起」。</text>
<text x="50" y="928" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">存得多 → 分层与向量；改得准 → 两阶段写与双时序；读得对 → 固定顺序与 600 字硬预算；丢得起 → 30 天软删 + 四层 purge 可证。</text>
<text x="50" y="954" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="600" fill="#2F6F7E" text-anchor="start" letter-spacing="0">对应门禁：G4（写三态）/ G5（双时序不覆盖）/ G7（备份与 purge 可证）。</text>
</g>
</svg>
