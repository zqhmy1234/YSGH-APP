<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000">
<defs><marker id="ah-ink" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#16324F"/></marker><marker id="ah-teal" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2F6F7E"/></marker><marker id="ah-warm" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#C7763F"/></marker><marker id="ah-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#A9B7C5"/></marker><marker id="ah-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#A8452F"/></marker></defs>
<rect width="1500" height="1000" fill="#FFFFFF"/>
<text x="40" y="46" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="26" font-weight="600" fill="#16324F" text-anchor="start" letter-spacing="0">摄入｜为什么要分级：导入是长事务，不是一次写库</text>
<text x="40" y="72" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="13" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">用户在 0 秒就有东西可翻；AI 在后台逐级把「能翻」升成「能看 / 能搜 / 能图搜」</text>
<rect x="1387.36" y="26" width="72.64" height="30" rx="15" fill="#EAF2F4" stroke="#2F6F7E" stroke-width="1" opacity="1"/>
<text x="1423.68" y="46" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#2F6F7E" text-anchor="middle" letter-spacing="0">图 04</text>
<rect x="40" y="104" width="1420" height="196" rx="10" fill="#F8EEE7" stroke="#C7763F" stroke-width="1" opacity="1"/>
<text x="60" y="134" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#16324F" text-anchor="start" letter-spacing="0">A · 用户视角：导入开始后的四个时刻（不等 AI 也能用）</text>
<rect x="60.0" y="154" width="333.0" height="118" rx="8" fill="#FFFFFF" stroke="#A9B7C5" stroke-width="1" opacity="1"/>
<text x="76.0" y="180" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#647788" text-anchor="start" letter-spacing="0">t = 0</text>
<text x="76.0" y="208" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#2F6F7E" text-anchor="start" letter-spacing="0">能翻</text>
<text x="76.0" y="236" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">时间轴立刻出现条目</text>
<rect x="409.0" y="154" width="333.0" height="118" rx="8" fill="#FFFFFF" stroke="#A9B7C5" stroke-width="1" opacity="1"/>
<text x="425.0" y="180" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#647788" text-anchor="start" letter-spacing="0">t ≈ 秒级</text>
<text x="425.0" y="208" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#2F6F7E" text-anchor="start" letter-spacing="0">能看</text>
<text x="425.0" y="236" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">缩略图出来，可点开</text>
<rect x="758.0" y="154" width="333.0" height="118" rx="8" fill="#FFFFFF" stroke="#A9B7C5" stroke-width="1" opacity="1"/>
<text x="774.0" y="180" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#647788" text-anchor="start" letter-spacing="0">t ≈ 分钟级</text>
<text x="774.0" y="208" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#3C5A78" text-anchor="start" letter-spacing="0">能搜</text>
<text x="774.0" y="236" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">ASR / caption 完成，可被搜到</text>
<rect x="1107.0" y="154" width="333.0" height="118" rx="8" fill="#FFFFFF" stroke="#A9B7C5" stroke-width="1" opacity="1"/>
<text x="1123.0" y="180" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#647788" text-anchor="start" letter-spacing="0">t ≈ 闲时</text>
<text x="1123.0" y="208" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#3C5A78" text-anchor="start" letter-spacing="0">能图搜</text>
<text x="1123.0" y="236" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">向量入库，可拿图搜图</text>
<text x="60" y="288" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#647788" text-anchor="start" letter-spacing="0">没有中间态，就只能对用户说「导完了」——而那时他搜不到任何东西。这就是假状态的源头。</text>
<rect x="40" y="324" width="1420" height="252" rx="10" fill="#F3F6FA" stroke="#A9B7C5" stroke-width="1" opacity="1"/>
<text x="60" y="354" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#16324F" text-anchor="start" letter-spacing="0">B · 系统视角：四级产物，每级独立完成、独立可重跑</text>
<rect x="60.0" y="376" width="334.5" height="168" rx="8" fill="#FFFFFF" stroke="#A9B7C5" stroke-width="1" opacity="1"/>
<text x="74.0" y="402" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#2F6F7E" text-anchor="start" letter-spacing="0">L0</text>
<text x="104.0" y="402" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" fill="#3C5A78" text-anchor="start" letter-spacing="0">status=uploaded</text>
<text x="74.0" y="426" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">index_level=L0</text>
<text x="74.0" y="454" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#3C5A78" text-anchor="start" letter-spacing="0">判定：行存在即可</text>
<text x="74.0" y="476" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">重跑：无</text>
<rect x="408.5" y="376" width="334.5" height="168" rx="8" fill="#FFFFFF" stroke="#A9B7C5" stroke-width="1" opacity="1"/>
<text x="422.5" y="402" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#2F6F7E" text-anchor="start" letter-spacing="0">L1</text>
<text x="452.5" y="402" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" fill="#3C5A78" text-anchor="start" letter-spacing="0">thumbnail_meta</text>
<text x="422.5" y="426" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">缩略图落 COS</text>
<text x="422.5" y="454" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#3C5A78" text-anchor="start" letter-spacing="0">判定：缩略图可取</text>
<text x="422.5" y="476" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">重跑：重新出图</text>
<rect x="757.0" y="376" width="334.5" height="168" rx="8" fill="#FFFFFF" stroke="#A9B7C5" stroke-width="1" opacity="1"/>
<text x="771.0" y="402" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#2F6F7E" text-anchor="start" letter-spacing="0">L2</text>
<text x="801.0" y="402" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" fill="#3C5A78" text-anchor="start" letter-spacing="0">text 非空</text>
<text x="771.0" y="426" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">ASR + VLM caption</text>
<text x="771.0" y="454" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#3C5A78" text-anchor="start" letter-spacing="0">判定：text 长度 &gt; 0</text>
<text x="771.0" y="476" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">重跑：单条重识别</text>
<rect x="1105.5" y="376" width="334.5" height="168" rx="8" fill="#FFFFFF" stroke="#A9B7C5" stroke-width="1" opacity="1"/>
<text x="1119.5" y="402" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#2F6F7E" text-anchor="start" letter-spacing="0">L3</text>
<text x="1149.5" y="402" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" fill="#3C5A78" text-anchor="start" letter-spacing="0">image_vec</text>
<text x="1119.5" y="426" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">向量入 Qdrant</text>
<text x="1119.5" y="454" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#3C5A78" text-anchor="start" letter-spacing="0">判定：向量可查</text>
<text x="1119.5" y="476" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">重跑：单条重算向量</text>
<text x="60" y="560" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#A8452F" text-anchor="start" letter-spacing="0">❌ 禁止：status=done 但 text 为空 —— 那是「导完了但搜不到」，必须退回 L1 并计入重跑队列。</text>
<rect x="40" y="600" width="1420" height="226" rx="10" fill="#FFFFFF" stroke="#2F6F7E" stroke-width="1" opacity="1"/>
<text x="60" y="630" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#16324F" text-anchor="start" letter-spacing="0">C · 为什么不能一把梭（三条硬理由）</text>
<rect x="60.0" y="650" width="449.3333333333333" height="150" rx="8" fill="#F3F6FA" stroke="#A9B7C5" stroke-width="1" opacity="1"/>
<text x="74.0" y="676" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#2F6F7E" text-anchor="start" letter-spacing="0">① 长事务</text>
<text x="74.0" y="702" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">5000 张全量 AI 处理是数小时级；</text>
<text x="74.0" y="724" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">单事务失败 = 全部重来。</text>
<text x="74.0" y="746" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">分级 = 断点续传 + 只重跑坏的那一级。</text>
<rect x="525.3333333333333" y="650" width="449.3333333333333" height="150" rx="8" fill="#F3F6FA" stroke="#A9B7C5" stroke-width="1" opacity="1"/>
<text x="539.3333333333333" y="676" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#2F6F7E" text-anchor="start" letter-spacing="0">② 等不起</text>
<text x="539.3333333333333" y="702" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">用户第一秒就要看到东西；</text>
<text x="539.3333333333333" y="724" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">先给「能翻」才有安全感，</text>
<text x="539.3333333333333" y="746" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">搜索能力后补，不阻塞使用。</text>
<rect x="990.6666666666666" y="650" width="449.3333333333333" height="150" rx="8" fill="#F3F6FA" stroke="#A9B7C5" stroke-width="1" opacity="1"/>
<text x="1004.6666666666666" y="676" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#2F6F7E" text-anchor="start" letter-spacing="0">③ 成本</text>
<text x="1004.6666666666666" y="702" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">VLM/向量全量跑最贵；</text>
<text x="1004.6666666666666" y="724" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">只有被搜到、被点开的才升 L3，</text>
<text x="1004.6666666666666" y="746" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">闲时才跑 P2，白天不抢资源。</text>
<rect x="40" y="848" width="1420" height="128" rx="10" fill="#F8EEE7" stroke="#C7763F" stroke-width="1" opacity="1"/>
<text x="60" y="878" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#16324F" text-anchor="start" letter-spacing="0">D · 由此产生的三条禁令（都可以被门禁断言）</text>
<text x="64" y="908" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="normal" fill="#3C5A78" text-anchor="start" letter-spacing="0">① 单一百分比条：它无法表达「能翻不能搜」→ 必须换成三档计数</text>
<text x="64" y="934" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="normal" fill="#3C5A78" text-anchor="start" letter-spacing="0">② progress=100% 但队列仍有积压 → 进度按「产物就绪」算，不按「上传完成」算</text>
<text x="64" y="960" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="normal" fill="#3C5A78" text-anchor="start" letter-spacing="0">③ 折叠写成删除：折叠只是视图层，原件必须还能展开</text>
</svg>
