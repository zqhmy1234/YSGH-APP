<text x="406" y="188" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">联想 / 预取器：为「下一轮可能用到」准备候选</text>
<rect x="392" y="220.0" width="636" height="82" rx="5" fill="#F3F6FA" stroke="#A9B7C5" stroke-width="1" opacity="1"/>
<rect x="392" y="220.0" width="3" height="82" rx="1" fill="5B8FA8" stroke="5B8FA8" stroke-width="0" opacity="1"/>
<text x="406" y="242.0" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11.2" font-weight="600" fill="5B8FA8" text-anchor="start" letter-spacing="0">② 工具</text>
<text x="406" y="260.0" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">topic 相似度、候选池读写、TTL 管理</text>
<text x="406" y="280.0" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">无发言工具、无推送工具</text>
<rect x="392" y="312.0" width="636" height="82" rx="5" fill="#F3F6FA" stroke="#A9B7C5" stroke-width="1" opacity="1"/>
<rect x="392" y="312.0" width="3" height="82" rx="1" fill="5B8FA8" stroke="5B8FA8" stroke-width="0" opacity="1"/>
<text x="406" y="334.0" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11.2" font-weight="600" fill="5B8FA8" text-anchor="start" letter-spacing="0">③ 内存视图</text>
<text x="406" y="352.0" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">候选池：容量上限 + TTL 1 天</text>
<text x="406" y="372.0" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">只存 id 与关联度，不存原文</text>
