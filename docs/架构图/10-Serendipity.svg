<text x="54" y="167" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="5B8FA8" text-anchor="start" letter-spacing="0">调用者</text>
<text x="54" y="202" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.6" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">应用层；由空闲事件或话题漂移信号触发</text>
<text x="54" y="233" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="5B8FA8" text-anchor="start" letter-spacing="0">触发</text>
<text x="54" y="268" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.6" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">闲时批 / 话题漂移 / 某人久未提及</text>
<text x="54" y="299" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="5B8FA8" text-anchor="start" letter-spacing="0">读什么</text>
<text x="54" y="334" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.6" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">MemoryPort(read)：叙事记忆片段</text>
<text x="54" y="365" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.6" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">TimelinePort：邻域事件</text>
