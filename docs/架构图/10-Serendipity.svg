<rect x="392" y="404.0" width="3" height="82" rx="1" fill="5B8FA8" stroke="5B8FA8" stroke-width="0" opacity="1"/>
<text x="406" y="426.0" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11.2" font-weight="600" fill="5B8FA8" text-anchor="start" letter-spacing="0">④ 约束</text>
<text x="406" y="444.0" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">只预取不发言；不写业务库；不触发任何回响/推送</text>
<text x="406" y="464.0" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">预取失败用户不可见，也不得改变本轮回答</text>
<rect x="392" y="496.0" width="636" height="82" rx="5" fill="#F3F6FA" stroke="#A9B7C5" stroke-width="1" opacity="1"/>
<rect x="392" y="496.0" width="3" height="82" rx="1" fill="5B8FA8" stroke="5B8FA8" stroke-width="0" opacity="1"/>
<text x="406" y="518.0" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11.2" font-weight="600" fill="5B8FA8" text-anchor="start" letter-spacing="0">⑤ 循环与预算</text>
<text x="406" y="536.0" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">后台批处理，可被前台任务抢占中断</text>
<text x="406" y="556.0" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">同一主题每日最多预取一次</text>
<rect x="1060" y="104" width="340" height="156.0" rx="10" fill="#FFFFFF" stroke="#A9B7C5" stroke-width="1" opacity="1"/>
<text x="1074" y="128" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11.2" font-weight="600" fill="#16324F" text-anchor="start" letter-spacing="0">输出契约</text>
<text x="1074" y="152" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">候选事件 id[] + 关联度分数</text>
<text x="1074" y="173" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">给 Muse：可选上下文（可不用）</text>
<text x="1074" y="194" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">不产出用户可见文本</text>
<rect x="1060" y="272.0" width="340" height="156.0" rx="10" fill="#FFFFFF" stroke="#A9B7C5" stroke-width="1" opacity="1"/>
<text x="1074" y="296.0" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11.2" font-weight="600" fill="#A8452F" text-anchor="start" letter-spacing="0">失败语义（三态以上）</text>
<text x="1074" y="320.0" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">静默放弃（用户无感）</text>
<text x="1074" y="341.0" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">候选为空不算失败</text>
<text x="1074" y="362.0" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">超时直接丢，不重试</text>
<rect x="1060" y="440.0" width="340" height="156.0" rx="10" fill="#F8EEE7" stroke="#C7763F" stroke-width="1" opacity="1"/>
<text x="1074" y="464.0" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11.2" font-weight="600" fill="#16324F" text-anchor="start" letter-spacing="0">成本档与队列</text>
<text x="1074" y="488.0" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">轻量模型；P2 队列</text>
<text x="1074" y="509.0" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">可中断；夜间优先</text>
<text x="1074" y="530.0" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.2" font-weight="normal" fill="#647788" text-anchor="start" letter-spacing="0">单用户每日预算上限</text>
<rect x="40" y="618" width="1360" height="54" rx="10" fill="#F3F6FA" stroke="#DDE4EB" stroke-width="1" opacity="1"/>
<text x="56" y="642" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.8" font-weight="normal" fill="#3C5A78" text-anchor="start" letter-spacing="0">与 Linger 的差异：Linger 的 Serendipity 偏向「记忆召回」；我们把它收窄成「预取候选」，因为本产品的召回已由 Librarian 承担。</text>
