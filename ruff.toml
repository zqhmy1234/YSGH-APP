# ruff 配置（忆述光华 backend + research）
# 规则集：bug 检测 + 未使用代码 + 安全 + 格式
line-length = 120

# 客户端（uni-app x：UTS/Kotlin/uvue）不属于 Python 工具链（B2 决策，2026-08-24）
exclude = ["client"]

[lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "DTZ", "BLE", "PLW"]
ignore = [
    "B008",   # FastAPI 依赖注入标准模式：Depends() 作默认值（官方推荐写法）
    "BLE001", # 顶层捕获 Exception：路由/脚本入口统一处理，内部已有错误码封装
]

# 时区规则仅 backend 严格（API 必须 tz-aware）；research 原型用 naive datetime 模拟测试数据
[lint.per-file-ignores]
"research/**" = ["DTZ001", "DTZ901"]
"backend/migrations/**" = ["E501", "W291", "I001", "UP"]  # Alembic 自动生成文件：模板风格非手写，格式豁免
"scripts/**" = ["S112", "S603", "S607", "S311", "DTZ001", "DTZ002"]  # 脚本读文件/调子进程/调 git 是审核器本职；生成测试数据用本地壁钟时间与种子随机（均有意义）
"scripts/api_smoke_cases.py" = ["S101"]  # 真实用例冒烟本身就是测试运行器（断言是本职）
"backend/tests/**" = ["S101"]  # pytest 测试天然用 assert 断言
"backend/tests/test_wechat.py" = ["S105"]  # 官方测试凭证（path/90931，非真实密钥）
"backend/tests/test_config_alias.py" = ["S105", "S106"]  # 密钥名测试占位值（old-key/ci-key 非真实）
"backend/scripts/wecom_sandbox.py" = ["S105"]  # 官方测试凭证（path/90931，非真实密钥）
"backend/app/services/wechat/gateway.py" = ["S314"]  # 企微回调 XML 固定协议：验签解密后解析，与官方 SDK 同构
"backend/app/services/wechat/signature.py" = ["S324"]  # msg_signature=SHA1 是企微协议强制（path/90931 官方向量），非自主选择
"backend/app/api/contents.py" = ["S106"]  # presign mock 凭证是契约占位，非真实密钥
"backend/app/core/config.py" = ["S105", "S104"]  # 默认值占位（.env 覆盖），非真实密钥
