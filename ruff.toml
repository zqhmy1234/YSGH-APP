# ruff 配置（忆述光华 backend + research）
# 规则集：bug 检测 + 未使用代码 + 安全 + 格式
line-length = 120

# 目标 Python 版本 —— **必须显式声明**（2026-10-10 补，缺陷 D17-1）
#
# 为什么必须写死：不写时 ruff 只能靠 pyproject 的 requires-python 推断，而**本仓没有
# pyproject.toml**，于是 target-version 一直走 ruff 自己的默认值 —— 这个默认值会随
# ruff 版本**静默变化**。2026-10-10 正是如此：ruff 0.17.0 改了默认推断，UP017
# (`datetime.UTC`) 在本仓 66 个文件 154 处突然报红，而代码一行没动。
# 显式声明后，规则集与本仓真实 Python 绑定，不再随工具版本漂移。
#
# 取值依据（三处一致，勿单一改动）：CI `.github/workflows/ci.yml` python-version 3.11、
# `deploy/Dockerfile.backend` FROM python:3.11-slim、本机 conda 环境 3.11。
# 注意：agent/ 是独立 py3.12 项目，但已在下方 exclude 中排除，本项对它无影响。
target-version = "py311"

# 客户端（uni-app x：UTS/Kotlin/uvue）不属于 Python 工具链（B2 决策，2026-08-24）
#
# agent：开发部同事交付的 Coze Agent 包（2026-09-23 原样入库，依据见 agent/UPSTREAM.md）。
#   ⚠️ **临时豁免**——上游 354 处违规（239 可自动修 + 115 手动，含 S310/S110/DTZ/PLW0603 等真问题）。
#   注意：本 exclude 只对**目录遍历**生效；pre-commit 快模式是显式传文件给 ruff
#   （`ruff check <files>`），故另有 `scripts/review_agent.py:_lint_skip()` 做列表层过滤。
#   **撤销待办 AG7**：改写批次完成后删除本项与 `_lint_skip` 的 agent 判断（两处同步），
#   登记见 docs/决策台账.md §4.12 与 docs/待办处理排期_20260923.md「Agent 接线批」。
exclude = ["client", "agent"]

[lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "DTZ", "BLE", "PLW"]
ignore = [
    "B008",   # FastAPI 依赖注入标准模式：Depends() 作默认值（官方推荐写法）
    "BLE001", # 顶层捕获 Exception：路由/脚本入口统一处理，内部已有错误码封装
]

[lint.isort]
known-first-party = ["scripts"]

# 时区规则仅 backend 严格（API 必须 tz-aware）；research 原型用 naive datetime 模拟测试数据
[lint.per-file-ignores]
"research/**" = ["DTZ001", "DTZ901"]
"backend/migrations/**" = ["E501", "W291", "I001", "UP"]  # Alembic 自动生成文件：模板风格非手写，格式豁免
"scripts/**" = ["S112", "S603", "S607", "S311", "DTZ001", "DTZ002"]  # 脚本读文件/调子进程/调 git 是审核器本职；生成测试数据用本地壁钟时间与种子随机（均有意义）
"scripts/api_smoke_cases.py" = ["S101"]  # 真实用例冒烟本身就是测试运行器（断言是本职）
"backend/tests/**" = ["S101"]  # pytest 测试天然用 assert 断言
"agent/tests/**" = ["S101"]    # 同上（Agent 交付包的测试目录，AG3 起纳入本仓测试链）
"backend/tests/test_wechat.py" = ["S105"]  # 官方测试凭证（path/90931，非真实密钥）
"backend/tests/test_wechat_binding.py" = ["S105"]  # 同上（D09 簇③ 复用官方测试凭证 + 占位值）
"backend/tests/test_config_alias.py" = ["S105", "S106"]  # 密钥名测试占位值（old-key/ci-key 非真实）
"backend/tests/test_auth.py" = ["S105"]  # Wave4-L code2session 测试占位凭证（wx-test-*/test-secret 非真实）
"backend/tests/test_content_safety.py" = ["S105"]  # Wave4-L 适配器测试占位密钥（ak-test/sk-test 非真实）
"backend/scripts/wecom_sandbox.py" = ["S105"]  # 官方测试凭证（path/90931，非真实密钥）
"backend/app/services/wechat/gateway.py" = ["S314"]  # 企微回调 XML 固定协议：验签解密后解析，与官方 SDK 同构
"backend/app/services/wechat/signature.py" = ["S324"]  # msg_signature=SHA1 是企微协议强制（path/90931 官方向量），非自主选择
"backend/app/api/contents.py" = ["S106"]  # presign mock 凭证是契约占位，非真实密钥
"backend/app/core/config.py" = ["S105", "S104"]  # 默认值占位（.env 覆盖），非真实密钥
