[project]
name = "yishu-agent"
version = "0.1.0"
description = "忆光 Agent 服务（去 Coze 版）——个人记忆助手，数据落我们自己的 Postgres"
requires-python = ">=3.12"
dependencies = [
    "langchain==1.0.3",
    "langchain-openai==1.0.1",
    "langgraph==1.0.2",
    "langgraph-checkpoint==3.0.0",
    "langgraph-prebuilt==1.0.2",
    "langgraph-sdk==0.2.9",
    "langsmith==0.4.39",
    "fastapi>=0.121,<1",
    "uvicorn>=0.38,<1",
    "pydantic>=2.12,<3",
    "Pillow>=10.3,<11",
    "alembic>=1.16,<2",
    "SQLAlchemy>=2.0,<3",
    "python-dotenv>=1.2,<2",
    "langgraph-checkpoint-postgres>=3.0,<4",
    "psycopg[binary]>=3.3,<4",
    "psycopg-pool>=3.3,<4",
    "wecom-aibot-sdk>=1.0.8",
]

# ── 依赖瘦身记录（2026-10-06，删前逐个核实过全仓 0 使用点）──
# 删 Coze 私有包 4 个：coze-coding-utils / coze-workload-identity / cozeloop
#   （源码零 import）+ coze-coding-dev-sdk（仅存的两个调用点已随 voice_tools /
#   export 预检改造移除）。
# 删 Linux-only 3 个：pycairo / dbus-python / PyGObject —— Windows 装不上，
#   是 `uv sync` 整体失败的根因。
# 删零使用 11 个（含大小写不敏感全仓复查 + 模板引擎核实）：
#   boto3（原属已删的 s3_storage）、opencv-python、pandas、psycopg2-binary
#   （本仓统一 psycopg 3，URL 是 postgresql+psycopg://）、pypdf、docx2python、
#   openpyxl、python-pptx、chardet、rich、Jinja2（web 面 index.html 无任何
#   Python 引用，非 Jinja2 渲染）。
# 若将来要接文档解析/表格导出，按需加回，别凭"可能用到"预装。

[tool.uv]
# 使用阿里云镜像作为默认源，替代 pypi.org
[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

# pypi 仅供 [tool.uv.sources] 显式引用：阿里云镜像同步 PyPI 新版有延迟（小时级），
# 当某个内部包的预发布版（如 a/b/rc 后缀）刚 push 到官方 PyPI 还未同步到镜像时，
# 临时让该包从 PyPI 取，避免 lock/install 失败。explicit=true 保证不影响其他包的解析。
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"
explicit = true

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio>=0.23,<1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
