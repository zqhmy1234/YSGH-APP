# 忆述光华 · CI（S2-05 收尾项，对齐 S1-04「CI 接入（lint+单测+构建检查，main 保护）」）
# 策略（2026-08-26 重构：快 + 拦截 + 高质量）：
#   双层并行：
#     - fast-gate：静态全仓门禁（语法/lint/密钥/TODO，~30s）——PR/推送即时反馈
#     - full-gate：全量门禁（pytest 全量 + api_smoke + research + 覆盖率）——最终把关
#   服务：postgres（yishu 隔离库）+ redis（RQ 队列）+ qdrant（向量库，全量覆盖不 deselect）
#   缓存：pip 缓存（拆 key + restore-keys 兜底增量）；HF 模型缓存（BGE-M3 按模型拆 key）
#   触发：develop/main 推送 + PR → develop/main（main 受保护，只接受 develop 合并；
#         建议 develop 也开 branch protection 要求两 job 通过，见 docs/项目API密钥清单与获取.md 同批讨论）
# 2026-08-27（批次 H2 R7 增强）：client tsc 试点 / 模型路径 annotation / 覆盖率统一 60 +
#   rag 计覆盖 / 缓存拆 key / docker exec psql / deselect 警告 / pip-audit 定时 / coverage.xml
name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  # P0-4（2026-08-27）：schema.sql ↔ alembic 漂移检测 weekly 巡检（周一 03:00 UTC），
  # 失败仅出 annotation，不参与 PR 门禁；支持 workflow_dispatch 手动触发。
  # 同 schedule 触发 pip-audit-weekly（T7 依赖漏洞定时审计）。
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-gate:
    name: Fast Gate（静态语法/lint/密钥）
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Run static gate (syntax/lint/secrets/todos, no tests)
        run: python scripts/review_agent.py --full --skip-tests

      - name: Client tsc pilot (client/utils tsc --noEmit, 失败 annotation)
        # T1（2026-08-27 批次 H2 R7）：client 目录类型自检试点，复用本地
        # .cowork-temp/c2_tscheck 方案（临时 tsconfig + uni-app x 环境桩 env.d.ts，
        # 覆盖 client/utils/*.ts 的 uni/UTSJSONObject/UTS 插件模块声明）。
        # 非阻断（continue-on-error）：试点期失败仅 annotation（匿名 API 可读），
        # 避免新型检查突发卡死主流水线；连续绿后可将 continue-on-error 移除转阻断。
        continue-on-error: true
        run: |
          mkdir -p .cowork-temp/c2_tscheck
          cat > .cowork-temp/c2_tscheck/tsconfig.json <<'JSON'
          {
          	"compilerOptions": {
          		"target": "ES2020",
          		"module": "ESNext",
          		"moduleResolution": "bundler",
          		"strict": true,
          		"noEmit": true,
          		"skipLibCheck": true,
          		"types": [],
          		"lib": ["ES2020"],
          		"noUnusedLocals": false,
          		"noUnusedParameters": false
          	},
          	"include": ["env.d.ts", "../../client/utils/*.ts"]
          }
          JSON
          cat > .cowork-temp/c2_tscheck/env.d.ts <<'TS'
          /**
           * A3 批次类型自检环境桩（临时文件，不提交；仅供 tsc --noEmit 验证 client/utils/*.ts）
           * uni-app x 运行时的 uni/UTSJSONObject 及 UTS 插件模块在此以最小签名声明。
           */

          // ---------- uni-app x 运行时全局 ----------
          declare interface UniRequestSuccess {
          	statusCode: number
          	data: any
          	header: any
          }

          declare const uni: {
          	request(options: {
          		url: string
          		method?: string
          		data?: any
          		header?: any
          		timeout?: number
          		success?: (res: UniRequestSuccess) => void
          		fail?: (err: any) => void
          	}): void
          	uploadFile(options: {
          		url: string
          		filePath?: string
          		name?: string
          		formData?: any
          		header?: any
          		timeout?: number
          		success?: (res: UniRequestSuccess) => void
          		fail?: (err: any) => void
          	}): any
          	getNetworkType(options: {
          		success?: (res: { networkType: string }) => void
          		fail?: (err: any) => void
          	}): void
          	getFileSystemManager(): {
          		getFileInfo(options: {
          			filePath: string
          			success?: (info: { size: number }) => void
          			fail?: (err: any) => void
          		}): void
          		[k: string]: any
          	}
          	getStorageSync(key: string): any
          	setStorageSync(key: string, value: any): void
          	removeStorageSync(key: string): void
          	onNetworkStatusChange(cb: (res: { isConnected: boolean; networkType: string }) => void): void
          	[k: string]: any
          }
          declare function getApp(): any
          declare function getCurrentPages(): any[]

          // ---------- 宿主环境（console/timer，ES lib 不包含） ----------
          declare const console: {
          	log(...args: any[]): void
          	warn(...args: any[]): void
          	error(...args: any[]): void
          }
          declare function setTimeout(cb: () => void, ms: number): number
          declare function clearTimeout(t: number): void
          declare function setInterval(cb: () => void, ms: number): number
          declare function clearInterval(t: number): void

          // ---------- UTSJSONObject（UTS 内置开放类型：对象字面量可直接赋值；实例方法经索引签名返回 any；静态 keys） ----------
          declare type UTSJSONObject = {
          	[key: string]: any
          }
          declare const UTSJSONObject: {
          	keys(obj: UTSJSONObject): Array<string>
          	parse?(s: string): UTSJSONObject
          	[k: string]: any
          }

          // ---------- UTS 插件模块桩（与真实 .uts 导出签名一致） ----------

          declare module '@/uni_modules/yishu-background-tasks/utssdk/app-android/index.uts' {
          	export function initBackgroundTasks(hours: number): void
          	export function setBackgroundTaskHandler(cb: ((taskType: string) => void) | null): void
          	export function drainPendingTasks(): void
          	export function drainPendingTask(): string
          	export function pendingTaskCount(): number
          	export function enqueueTask(taskType: string): void
          	export function lastWakeupAt(): string
          	export function isWorkManagerAvailable(): boolean
          }

          declare module '@/uni_modules/yishu-photo-watch/utssdk/interface.uts' {
          	export class PhotoItem {
          		constructor(...args: any[])
          		[key: string]: any
          	}
          }

          declare module '@/uni_modules/yishu-recorder/utssdk/app-android/index.uts' {
          	export class RecorderController {
          		[key: string]: any
          	}
          	export function createRecorder(...args: any[]): RecorderController
          }
          TS
          cd .cowork-temp/c2_tscheck
          set +e
          npx --yes -p typescript@5.5.4 tsc --noEmit -p tsconfig.json > tsc.log 2>&1
          code=$?
          set -e
          python - "$code" <<'EOF'
          import pathlib, re, sys
          code = int(sys.argv[1])
          log = pathlib.Path("tsc.log")
          text = log.read_text(errors="replace") if log.exists() else ""
          if code == 0:
              print("::notice title=client-tsc::client/utils tsc --noEmit 通过（0 errors）")
              sys.exit(0)
          pat = re.compile(r'^(?P<file>[^(:]+\.ts)\((?P<line>\d+),(?P<col>\d+)\): error (?P<code>[A-Z0-9]+): (?P<msg>.*)$')
          n = 0
          for m in pat.finditer(text):
              n += 1
              print(f"::error file={m['file']},line={m['line']},col={m['col']}::{m['code']}: {m['msg'][:300]}")
          print(f"::error title=client-tsc::{n} 个 tsc 错误（client/utils），原始输出如下")
          print(text[-3000:])
          sys.exit(0)
          EOF
          exit 0

  full-gate:
    name: Full Gate（全量 pytest + api_smoke + research）
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # 2026-08-26 修复：DATABASE_URL 等提到 job 级——Init PG 步骤的 alembic upgrade head
    # 也需要读 DATABASE_URL（此前只在 quality gate 步骤定义 → alembic 用默认 postgres:postgres 密码错 exit 1，
    # 即 #8-#11 连续失败根因；#6 用 schema.sql 不需要 DATABASE_URL 故成功）。
    env:
      DATABASE_URL: postgresql+psycopg://yishu_app:yishu_app_2026@localhost:5432/yishu
      REDIS_URL: redis://localhost:6379/0
      QDRANT_URL: http://localhost:6333
      MOCK_EXTERNAL_AI: "true"
      # 本地 embedding.py 默认 HF_HUB_OFFLINE=1（防国内网络 HEAD 超时挂起）；
      # CI 是全新缓存，需联网下载 BGE-M3（~2.2GB），显式覆盖为 0。
      HF_HUB_OFFLINE: "0"
      PYTHONPATH: .

    services:
      postgres:
        # 2026-08-26：postgres:16-alpine → pgvector/pgvector:pg16（官方镜像自带 vector 扩展；
        # schema.sql 建库需要 CREATE EXTENSION vector，普通 postgres 镜像无此扩展致 test_vector_extension 挂）
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      qdrant:
        # 2026-08-26：v1.9.7 → v1.19.0（与 requirements qdrant-client>=1.19 匹配；
        # 旧版 server 与新版 client 不兼容致 api_smoke payload 刷新 404——#17/#18 失败根因）
        image: qdrant/qdrant:v1.19.0
        ports:
          - 6333:6333
        # 官方镜像自带 HEALTHCHECK（/healthz），勿加 curl health-cmd（镜像内无 curl）

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        # 2026-08-27（T4）：去掉 cache: pip（其仅精确 hash 命中才恢复，requirements 变更即全量重下）
        # ——由下方显式 pip-cache 步骤 + restore-keys 兜底增量代替。
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: pip cache（T4：按 requirements 拆 key + restore-keys 增量兜底）
        # setup-python 的 cache: pip 无 restore-keys 兜底：requirements 任何变更 →
        # pip 缓存全量失效重下。改为显式 actions/cache：key 按 requirements.txt hash 拆，
        # restore-keys 兜底最近缓存 → pip 仅增量重下变更包（避免全量重下）。
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: HF model cache · BGE-M3（T4：按模型拆 key，避免任一消费文件变更牵连全量）
        # 原单一 ~/.cache/huggingface + hashFiles(embedding,rerank,classifier)：任一文件变更
        # 即整库 key 失效（restore-keys 兜底最近缓存仍免重下，但大缓存易被 7 天/10GB eviction
        # 挤占）。拆为 BGE-M3 单独条目：仅 key 其消费方 embedding.py（rerank/setfit 均为仓库
        # 本地模型，不走 HF），模型内容稳定跨 commit 复用；restore-keys 按 commit 演进兜底。
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub/models--BAAI--bge-m3
          key: hf-bge-m3-${{ runner.os }}-${{ hashFiles('backend/app/services/embedding.py') }}
          restore-keys: |
            hf-bge-m3-${{ runner.os }}-

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov httpx ruff

      - name: Dependency vulnerability scan (pip-audit, non-blocking annotation)
        # TD-P2A（2026-08-26）：依赖扫描入 CI（技术债清理计划 P3-60）。
        # pip-audit 对解析后的依赖树做 CVE 核验（OSV 库）；失败仅 annotation 标注不阻断
        # （continue-on-error）——OSV 网络抖动/误报需人工判读，避免假阳性卡死主流水线。
        # 报告落 .cowork-temp/pip-audit.json 随 test-reports artifact 存档。
        # 注：周一定时全量审计见 pip-audit-weekly job（T7）。
        continue-on-error: true
        run: |
          mkdir -p .cowork-temp
          pip install pip-audit
          pip-audit -r backend/requirements.txt --format=json > .cowork-temp/pip-audit.json 2>.cowork-temp/pip-audit.err || echo "pip-audit 非零退出（不阻断，见 annotation）"
          python - <<'EOF'
          import json, pathlib
          report = pathlib.Path('.cowork-temp/pip-audit.json')
          err = pathlib.Path('.cowork-temp/pip-audit.err')
          if not report.exists() or report.stat().st_size == 0:
              print('::warning file=backend/requirements.txt::pip-audit 未产出报告（离线/网络失败），请人工核验依赖安全')
              if err.exists():
                  print('::warning::pip-audit stderr: ' + err.read_text(errors='replace')[-400:])
              raise SystemExit(0)
          try:
              data = json.loads(report.read_text(encoding='utf-8'))
          except json.JSONDecodeError as exc:
              print(f'::warning::pip-audit 输出解析失败: {exc}')
              raise SystemExit(0)
          vulns = data.get('vulnerabilities', [])
          if not vulns:
              print('::notice::pip-audit 未发现已知漏洞')
          else:
              items = []
              for v in vulns[:20]:
                  name = v.get('name', '?')
                  version = v.get('version', '?')
                  vid = (v.get('vuln') or {}).get('id', '?')
                  items.append(f'{name} {version} -> {vid}')
              print(f"::warning file=backend/requirements.txt::{len(vulns)} 个已知漏洞: {'; '.join(items)}")
          EOF

      - name: Init PostgreSQL (yishu 隔离库 + schema, docker exec psql)
        # T5（2026-08-27 批次 H2 R7）：PG 就绪/迁移校验改 docker exec psql 形态——
        #   免 apt-get install postgresql-client（省时、免 apt 网络依赖）；psql/pg_isready
        #   由 pgvector 镜像自带，`docker exec` 直接进 service 容器执行。
        # #13 教训（多用户密码内联）：每条命令用 `-e PGPASSWORD=<该用户密码>` 内联，
        #   绝不收敛成步骤级单一 env 密码（曾致 -U yishu_app 拿 admin 密码认证失败 exit 2）。
        # 注：这些是 CI 容器内测试密码（非生产密钥），明文在仓库无新增泄露面。
        run: |
          CID=$(docker ps -qf "name=postgres" | head -n1)
          if [ -z "$CID" ]; then
            echo "::error::postgres service 容器未找到（docker ps 过滤 name=postgres）"
            exit 1
          fi
          echo "postgres container: $CID"
          for i in $(seq 1 20); do
            docker exec "$CID" pg_isready -U postgres >/dev/null 2>&1 && { echo "postgres ready (try $i)"; break; }
            echo "[$i] postgres 未就绪，5s 后重试..."
            sleep 5
          done
          # setup_pg.sql：建角色 yishu_app + 建库 yishu + 授权 + vector 扩展（\connect yishu 收尾）
          docker exec -i -e PGPASSWORD=admin "$CID" psql -U postgres -v ON_ERROR_STOP=1 < scripts/setup_pg.sql
          # pgvector 非 trusted 扩展需超级用户安装（yishu_app 无权限）；schema.sql 里 IF NOT EXISTS 幂等跳过
          docker exec -e PGPASSWORD=admin "$CID" psql -U postgres -d yishu -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS vector"
          docker exec -i -e PGPASSWORD=yishu_app_2026 "$CID" psql -U yishu_app -d yishu -v ON_ERROR_STOP=1 < backend/sql/schema.sql
          docker exec -e PGPASSWORD=yishu_app_2026 "$CID" psql -U yishu_app -d yishu -c "SELECT current_database(), current_user;"

      - name: Generate test photos (api_smoke photo-journey 链路需要；test_photos 为 gitignore 资产，CI 全新检出需生成)
        run: python scripts/generate_test_photos.py

      - name: Warm HF models (BGE-M3 预下载，避免测试中现场下载 2.2GB 超时/失败致 5 个 pipeline 测试 status=failed)
        # 2026-08-26：cache miss 时模型下载失败会以 5 个测试模糊失败呈现；预热步骤显式下载，失败即明确报错
        # T2（2026-08-27）：脚本成功/失败均输出 HF/模型路径 annotation（匿名 API 可读）。
        env:
          HF_HUB_OFFLINE: "0"
        run: python scripts/warm_hf_models.py

      - name: Run static quality gate (review_agent --full --skip-tests)
        # T3（2026-08-27）：原 review_agent --full 内部以 50 阈值跑测试（review_agent 硬编码
        # --cov-threshold 50，不在本批次改动域）。拆为：本步静态门禁（--skip-tests）+ 下步
        # 测试门禁（test_agent --cov-threshold 60），使 CI 覆盖率阈值统一 60%。
        run: python scripts/review_agent.py --full --skip-tests

      - name: Run full tests + coverage (test_agent --cov-threshold 60)
        # T3/T8（2026-08-27）：60% 统一阈值 + rag 分组计入覆盖率（test_agent 内主套件 +
        # rag --cov-append 合并判定）+ 产出 .cowork-temp/coverage.xml（下步 rag 步骤再幂等合并，
        # 最终随 artifact 上传）。deselect 时 test_agent 输出显式 ::warning::（T6）。
        # env 继承 job 级（DATABASE_URL/REDIS_URL/QDRANT_URL/MOCK_EXTERNAL_AI/HF_HUB_OFFLINE/PYTHONPATH）
        run: python scripts/test_agent.py --cov-threshold 60

      - name: Run RAG integration tests (pytest -m rag)
        # TD-P1C（2026-08-26）：RAG 门禁盲区——本地 pytest 默认 -m "not rag"，
        # 此步骤显式跑 rag 分组，19 个检索/精排/以图搜图用例进 CI。
        # 写 test_ 前缀隔离 collection（QDRANT_COLLECTION），不碰生产 yishu_contents。
        # T3（2026-08-27）：追加 --cov-append + xml——rag 用例计入覆盖率（与 test_agent 的
        # rag 段幂等合并），最终 .cowork-temp/coverage.xml 反映合并后覆盖（T8 产物）。
        env:
          QDRANT_COLLECTION: test_yishu_contents
        run: python -m pytest backend/tests -m rag -q --tb=short --cov=backend/app --cov-append --cov-report=xml:.cowork-temp/coverage.xml

      - name: Clean up test Qdrant collections (best-effort)
        # TD-P1C（2026-08-26）：每跑结束清理 test_ 前缀 collection（尽力而为，失败不阻断）
        if: always()
        run: >-
          python -c
          "import sys; sys.path.insert(0, 'backend');
          from app.services.vector_store import cleanup_test_collections;
          print('removed:', cleanup_test_collections())"

      - name: Report failure details to annotation (diagnostic)
        # 2026-08-26：失败详情写进 annotation（GitHub API 可匿名读 annotations，日志需登录）
        # T2（2026-08-27）：HF/模型路径信息一并写进 annotation（匿名 API 可读，排障免登录日志）。
        if: failure()
        run: |
          python - <<'EOF'
          import json, os, pathlib
          # T2：HF/模型路径写进 annotation
          hub = os.environ.get('HF_HUB_CACHE')
          if not hub:
              hub = str(pathlib.Path.home() / '.cache' / 'huggingface' / 'hub')
          bge = pathlib.Path(hub) / 'models--BAAI--bge-m3'
          print('::error title=model-paths::HF_HUB_CACHE=' + hub +
                ' | BGE-M3 cached=' + ('YES' if bge.is_dir() else 'NO') +
                ' | reranker=backend/models/bge-reranker-base' +
                ' | setfit=backend/models/setfit-classifier')
          for f in ['.cowork-temp/review-report.json', '.cowork-temp/test-report.json']:
              p = pathlib.Path(f)
              if p.exists():
                  data = json.loads(p.read_text(encoding='utf-8'))
                  if f.endswith('test-report.json'):
                      out = {k: {'ok': v['ok'], 'tail': v['output'][-1800:]} for k, v in data.get('details', {}).items()}
                  else:
                      out = {'blocking': data.get('blocking_checks'), 'details': {k: {'ok': v['ok'], 'tail': v['output'][-1200:]} for k, v in data.get('details', {}).items()}}
                  msg = json.dumps(out, ensure_ascii=False)[:3500]
                  print(f'::error file={f}::{msg}')
              else:
                  print(f'::warning file={f}::{f} not found')
          EOF

      - name: Upload pytest coverage (+ coverage.xml)
        # T8（2026-08-27）：.cowork-temp/ 含 coverage.xml（test_agent/rag 步骤产出），随 artifact 上传。
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: .cowork-temp/
          if-no-files-found: ignore

  # ============================================================
  # P0-4（2026-08-27）：schema.sql ↔ alembic 迁移链漂移检测（weekly）
  # 背景：CI 建库源 = schema.sql，本地/生产走 alembic，两链无强制对齐——#8~#19 系列
  # CI 失败几乎全是漂移类（缺表/缺列/FK/vector 扩展）；lessons.md:97 解法落地。
  # 设计：脚本在临时库分别用 schema.sql 与 alembic head（失败回退 ORM metadata）建库，
  #       对比表集合/列/索引/外键/唯一约束/主键；退出码 1 = 检出漂移。
  # 失败策略：continue-on-error 仅出 annotation，不阻断主流水线（避免拖慢 PR）。
  schema-drift-weekly:
    name: Schema Drift（weekly，schema.sql ↔ alembic）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 仅 schedule/workflow_dispatch 触发（不参与 push/PR 门禁）；
    # 不加此 if 时 schedule 事件会连带跑 fast-gate/full-gate（未修改其逻辑，用 if 隔离）。
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps (sqlalchemy/psycopg/alembic/pydantic——仅漂移检测所需，不装全量 requirements)
        run: pip install sqlalchemy "psycopg[binary]" alembic pydantic pydantic-settings

      - name: Run schema drift check (漂移仅出 annotation，不阻断)
        # P0-4：检出漂移 → 脚本 exit 1 + ::error:: annotation；continue-on-error 保证
        # weekly job 失败不破坏主流水线状态（主流水线=fast-gate/full-gate，PR 不受影响）。
        continue-on-error: true
        run: python scripts/check_schema_drift.py --admin-url postgresql+psycopg://postgres:admin@localhost:5432/postgres

  # ============================================================
  # T7（2026-08-27 批次 H2 R7）：依赖漏洞扫描定时 job（weekly）
  # 区别于 full-gate 内非阻断的 pip-audit 步骤：本 job 发现漏洞即失败（红色定时 run 即告警
  # 信号，可在 GitHub 配置通知），报告落 artifact 存档。误报（OSV 数据源）可人工判读，
  # 必要时评论豁免后重新触发 workflow_dispatch。
  pip-audit-weekly:
    name: Dependency Audit（weekly · pip-audit）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit backend requirements (blocking on findings)
        run: |
          mkdir -p .cowork-temp
          set +e
          pip-audit -r backend/requirements.txt --format=json > .cowork-temp/pip-audit.json 2>.cowork-temp/pip-audit.err
          audit_code=$?
          set -e
          python - "$audit_code" <<'EOF'
          import json, pathlib, sys
          audit_code = int(sys.argv[1])
          report = pathlib.Path('.cowork-temp/pip-audit.json')
          err = pathlib.Path('.cowork-temp/pip-audit.err')
          if not report.exists() or report.stat().st_size == 0:
              print('::warning::pip-audit 未产出报告（离线/网络失败），请人工核验依赖安全')
              if err.exists():
                  print('::warning::pip-audit stderr: ' + err.read_text(errors='replace')[-400:])
              sys.exit(0)  # 工具/网络故障不当作漏洞失败
          try:
              data = json.loads(report.read_text(encoding='utf-8'))
          except json.JSONDecodeError as exc:
              print(f'::warning::pip-audit 输出解析失败: {exc}')
              sys.exit(0)
          vulns = data.get('vulnerabilities', [])
          if not vulns:
              print('::notice::pip-audit 未发现已知漏洞')
              sys.exit(0)
          items = []
          for v in vulns[:30]:
              name = v.get('name', '?')
              version = v.get('version', '?')
              vid = (v.get('vuln') or {}).get('id', '?')
              items.append(f'{name} {version} -> {vid}')
          print(f"::error::发现 {len(vulns)} 个已知漏洞（定时审计 → 红色 run 即告警）: {'; '.join(items)}")
          sys.exit(1)
          EOF

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-weekly
          path: .cowork-temp/pip-audit.json
          if-no-files-found: ignore
