# 忆述光华 · CI（S2-05 收尾项，对齐 S1-04「CI 接入（lint+单测+构建检查，main 保护）」）
# 策略（2026-08-26 重构：快 + 拦截 + 高质量）：
#   双层并行：
#     - fast-gate：静态全仓门禁（语法/lint/密钥/TODO，~30s）——PR/推送即时反馈
#     - full-gate：全量门禁（pytest 全量 + api_smoke + research + 覆盖率）——最终把关
#   服务：postgres（yishu 隔离库）+ redis（RQ 队列）+ qdrant（向量库，全量覆盖不 deselect）
#   缓存：HF 模型缓存（BGE-M3 ~2.2GB 免重复下载，首次冷缓存后大幅提速）
#   触发：develop/main 推送 + PR → develop/main（main 受保护，只接受 develop 合并；
#         建议 develop 也开 branch protection 要求两 job 通过，见 docs/项目API密钥清单与获取.md 同批讨论）
name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-gate:
    name: Fast Gate（静态语法/lint/密钥）
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Run static gate (syntax/lint/secrets/todos, no tests)
        run: python scripts/review_agent.py --full --skip-tests

  full-gate:
    name: Full Gate（全量 pytest + api_smoke + research）
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      qdrant:
        image: qdrant/qdrant:v1.9.7
        ports:
          - 6333:6333
        # 官方镜像自带 HEALTHCHECK（/healthz），勿加 curl health-cmd（镜像内无 curl）

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: HF model cache (BGE-M3 ~2.2GB 免重复下载)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ runner.os }}-${{ hashFiles('backend/app/services/embedding.py', 'backend/app/services/rerank.py', 'backend/app/services/classifier.py') }}
          restore-keys: |
            hf-models-${{ runner.os }}-

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov httpx ruff

      - name: Init PostgreSQL (yishu 隔离库 + alembic upgrade head)
        # 2026-08-26 issue #2：建库改跑 alembic upgrade head（迁移历史为单一事实来源）。
        # #8/#9/#10 连续挂此步（psql 连接/认证失败，schema/alembic 两种建库同挂）→ 加重试循环+详细输出定位。
        env:
          PGPASSWORD: admin
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
          for i in $(seq 1 20); do
            psql -h localhost -U postgres -c "select 1" >/dev/null 2>&1 && { echo "postgres ready (try $i)"; break; }
            echo "[$i] postgres 未就绪，5s 后重试..."
            sleep 5
          done
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f scripts/setup_pg.sql
          cd backend && alembic upgrade head
          psql -h localhost -U yishu_app -d yishu -c "SELECT current_database(), current_user;"

      - name: Generate test photos (api_smoke photo-journey 链路需要；test_photos 为 gitignore 资产，CI 全新检出需生成)
        run: python scripts/generate_test_photos.py

      - name: Run quality gate (review_agent --full)
        env:
          DATABASE_URL: postgresql+psycopg://yishu_app:yishu_app_2026@localhost:5432/yishu
          REDIS_URL: redis://localhost:6379/0
          QDRANT_URL: http://localhost:6333
          MOCK_EXTERNAL_AI: "true"
          # 本地 embedding.py 默认 HF_HUB_OFFLINE=1（防国内网络 HEAD 超时挂起）；
          # CI 是全新缓存，需联网下载 BGE-M3（~2.2GB），显式覆盖为 0。
          HF_HUB_OFFLINE: "0"
          PYTHONPATH: .
        run: python scripts/review_agent.py --full

      - name: Upload pytest coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: .cowork-temp/
          if-no-files-found: ignore
