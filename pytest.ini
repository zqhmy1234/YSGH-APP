[pytest]
markers =
    unit: 纯单元测试（无外部依赖：无 PG/Redis/Qdrant/网络，秒级快速回归用 -m unit）
    integration: 需要本地 PostgreSQL（yishu 隔离库）的集成测试
    slow: 重测试（真模型/真向量库/长耗时，本地快速回归用 -m "not slow" 排除）
    rag: 需要 BGE-M3 + Qdrant 的 RAG 集成测试（重：不随默认跑，用 -m rag）
testpaths = backend/tests
# 分层（H3/R8#10，2026-08-27）：
#   - 快速单测：    pytest -m unit
#   - 排除重测试：  pytest -m "not slow"
#   - 集成（含 DB）：pytest -m integration
#   - RAG 盲区：    pytest -m rag（CI full-gate 兜底，19 个检索/精排/以图搜图用例）
# TD-P1C（2026-08-26）：本地默认排除重 RAG 分组（保持秒级快速回归）；
# RAG 盲区由 CI full-gate 的 `pytest -m rag` 步骤兜底。命令行显式 `-m rag` 覆盖本默认值。
addopts = -m "not rag"
