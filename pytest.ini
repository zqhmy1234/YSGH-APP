[pytest]
markers =
    integration: 需要本地 PostgreSQL（yishu 隔离库）的集成测试
    rag: 需要 BGE-M3 + Qdrant 的 RAG 集成测试（重：不随默认跑，用 -m rag）
testpaths = backend/tests
# TD-P1C（2026-08-26）：本地默认排除重 RAG 分组（保持秒级快速回归）；
# RAG 盲区由 CI full-gate 的 `pytest -m rag` 步骤兜底（19 个检索/精排/以图搜图
# 用例进 CI）。命令行显式 `-m rag` 覆盖本默认值（后出现者生效）。
addopts = -m "not rag"
